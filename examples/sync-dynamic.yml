# =============================================================================
# GitHub Fork 自动同步工作流 - 动态发现版 (通用模板)
# =============================================================================
# 适用: 自动同步你名下所有 fork 到上游,免维护 fork 列表
# 风格: 动态发现 (auto-discover),不需要 hardcode fork 列表
# 优势: GitHub CLI/API 调用,只 checkout 配置仓库脚本,不 checkout 目标 fork,自动备份,智能判断 ahead/behind
#
# 跟 .github/workflows/sync-dynamic.yml 的区别:
#   - 本文件 (通用模板): 默认同步所有 fork,不做任何排除
#   - .github/workflows/sync-dynamic.yml (作者日常使用): 自动排除 claude 相关 fork
#
# 启用步骤 (在 fork 后的仓库):
#   1. 把本文件复制到 .github/workflows/sync-dynamic.yml
#      (或自己起名,但要确保在 .github/workflows/ 里才会被 GitHub 自动跑)
#   2. 删掉或改名 .github/workflows/ 里现有的同名 yml (避免冲突)
#   3. 仓库 Settings → Secrets and variables → Actions 新增 FORK_SYNC_TOKEN
#      (PAT,需要目标 fork 的 Contents read/write 权限)
#   4. 仓库 Settings → Actions → General → Workflow permissions 选 "Read and write permissions"
#   5. Actions 标签页点 "I understand my workflows, go ahead and enable them"
#
# 详细文档见 ../docs/ 目录
# =============================================================================

name: Sync All My Forks (Auto Discover, Generic)

on:
  # 改频率:把下面 3 行取消注释你想用的,注释掉不用的 (cron 是 UTC 时间)
  #   '0 0 * * *'    = 每天 00:00 UTC (北京时间 08:00) — 默认
  #   '0 */6 * * *'  = 每 6 小时 (00, 06, 12, 18 UTC)
  #   '0 0 * * 1'    = 每周一 00:00 UTC (北京时间周一 08:00)
  schedule:
    - cron: '0 0 * * *'
    # - cron: '0 */6 * * *'
    # - cron: '0 0 * * 1'
  # 允许 Actions 标签页手动触发
  workflow_dispatch:
    inputs:
      cron_schedule:
        description: '手动触发时填的 cron 表达式,只 log 不影响逻辑 (实际自动 schedule 看上面块)'
        required: false
        default: ''
      upstream_owner_filter:
        description: '只同步这个 owner 旗下的 fork (留空 = 同步所有 fork)'
        required: false
        default: ''
      target_owners:
        description: '要同步的 fork owner 列表 (逗号分隔,留空 = 自己;支持用户名和 org,自动判断)'
        required: false
        default: ''
      only_repos:
        description: '只同步这些 fork 仓库名,逗号分隔;支持 repo 或 owner/repo (留空 = 不限制,适合单仓库测试)'
        required: false
        default: ''
      exclude_repos:
        description: '指定要排除的 fork 名,逗号分隔 (留空 = 不排除指定 fork)'
        required: false
        default: ''
      size_drop_threshold:
        description: '上游体积暴减告警阈值 (上游体积/fork 体积 < 此值触发,默认 0.10 = 10%)'
        required: false
        default: ''
      size_check_exempt:
        description: '豁免 size 检查的 fork 名,逗号分隔 (留空 = 不豁免任何 fork,适用于 1KB CLI 工具之类的小项目)'
        required: false
        default: ''
      max_parallel:
        description: '最大并发数 (默认 4,推荐 2-8,过高会触发 API 限流)'
        required: false
        default: ''
      max_branches_per_fork:
        description: '每个 fork 最多同步 upstream 分支数 (默认 6;0 = 不限制)'
        required: false
        default: ''
      skip_branch_patterns:
        description: '跳过 upstream 分支 glob,逗号分隔 (默认跳过 backup/local-backup/sync-upstream/dependabot)'
        required: false
        default: ''
      full_branch_sync_repos:
        description: '这些 fork 同步全部 upstream 分支,逗号分隔;支持 repo 或 owner/repo'
        required: false
        default: ''
      branch_limit_groups:
        description: '按分支数分组指定 fork,格式 3:repo-a,repo-b;10:owner/repo-c;0:repo-d'
        required: false
        default: ''
      branch_limit_overrides:
        description: '按仓库指定任意分支上限,格式 repo=12,owner/repo=20;0 = 不限制'
        required: false
        default: ''
      dry_run:
        description: '干跑模式 (true = 只看不动,只打 log 不真写,默认 false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      disable_fork_workflows_repos:
        description: '同步前禁用这些 fork 的 workflows,逗号分隔;all = 本次发现的全部 fork;留空 = 关闭'
        required: false
        default: ''
      disable_fork_workflows_keep_patterns:
        description: '禁用 workflow 白名单 glob,逗号分隔;匹配 workflow 名称、路径或文件名'
        required: false
        default: ''
      sync_mode:
        description: '同步模式 (auto = 自动同步;pr = 开 PR 让人审,只对 behind 状态有效)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - pr
      webhook_url:
        description: '完成后通知的 webhook URL (留空 = 不通知;支持 Slack / 钉钉 / 通用,看 webhook_type)'
        required: false
        default: ''
      webhook_type:
        description: 'webhook 类型 (slack / dingtalk / generic)'
        required: false
        default: 'slack'
        type: choice
        options:
          - slack
          - dingtalk
          - generic
      discard_local_changes:
        description: 'upstream 有新增且 fork 有本地提交时的处理方式'
        required: false
        default: 'force'
        type: choice
        options:
          - force
          - keep

# 显式声明需要写权限
permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-all:
    runs-on: ubuntu-latest
    env:
      MY_OWNER: ${{ github.repository_owner }}
      # 多仓库同步请配置 FORK_SYNC_TOKEN (PAT);否则通常只能写当前配置仓库。
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      # 通用模板默认不设阈值,让 forker 手动触发时填
      # 推荐 0.10 (敏感) 或 0.30 (宽松),0 = 关闭
      DEFAULT_SIZE_DROP_THRESHOLD: '0.10'
      # 通用模板默认并发数,forker 可调
      DEFAULT_MAX_PARALLEL: '4'
      # 通用模板默认每个 fork 最多处理的 upstream 分支数
      # 6 = 先处理默认分支 + 前 5 个其他分支,避免多分支仓库打爆 API
      # 0 = 不限制 (只建议在单仓库测试或白名单里使用)
      DEFAULT_MAX_BRANCHES_PER_FORK: '6'
      # 默认跳过自动生成/备份类 upstream 分支
      # 默认分支永远优先处理,不受这里影响
      DEFAULT_SKIP_BRANCH_PATTERNS: 'backup/*,local-backup/*,sync-upstream/*,dependabot/*'
      # 特定 fork 分支上限口子 (逗号分隔,支持 repo 或 owner/repo)
      DEFAULT_FULL_BRANCH_SYNC_REPOS: ''
      # 任意分组口子: 3:repo-a,repo-b;10:owner/repo-c;0:repo-d
      DEFAULT_BRANCH_LIMIT_GROUPS: ''
      # 任意 N 口子: repo=12,owner/repo=20;值为 0 表示该 repo 不限制
      DEFAULT_BRANCH_LIMIT_OVERRIDES: ''
      # 通用模板默认不豁免 size 检查,让 forker 手动触发时填
      # 推荐 1KB CLI 工具之类的小项目加这里
      DEFAULT_SIZE_CHECK_EXEMPT: ''
      # upstream 有新增且 fork 有本地提交时的处理方式
      # force = 去重备份本地修改后,执行 GitHub Discard commits,和 upstream 完全一致 (默认)
      # keep  = 去重备份本地修改后,使用 merge-upstream 合并上游更新
      # 纯 ahead 且 upstream 无新增时跳过,不备份也不写分支
      DEFAULT_DISCARD_LOCAL_CHANGES: 'force'
      # 保护跳过列表: 只做 local-backup 保护备份,不进入同步/Discard。
      DEFAULT_PROTECTED_SKIP_REPOS: ''
      # 集中备份后同步列表: 先备份到统一仓库,再允许原 fork 对齐当前指向库。
      DEFAULT_BACKUP_THEN_SYNC_REPOS: ''
      # 集中备份仓库,例如 Link-Start/fork-legacy-backups;留空则禁用列表 2。
      DEFAULT_LEGACY_BACKUP_REPO: ''
      # 集中备份分支前缀。
      DEFAULT_LEGACY_BACKUP_BRANCH_PREFIX: 'legacy'
      # 同步前禁用目标 fork 的 workflows,默认关闭,避免影响通用 fork 的 CI/release/deploy。
      DEFAULT_DISABLE_FORK_WORKFLOWS: 'false'
      # all = 本次发现的全部 fork;也支持 repo 或 owner/repo 逗号分隔。
      DEFAULT_DISABLE_FORK_WORKFLOWS_REPOS: ''
      # 白名单 glob,匹配 workflow 名称、路径或文件名,例如 ci.yml,release*,.github/workflows/docs.yml。
      DEFAULT_DISABLE_FORK_WORKFLOWS_KEEP_PATTERNS: ''
    steps:
      - name: Checkout config repository
        uses: actions/checkout@v4

      # =====================================================================
      # Step 0: 读 .github/sync-config.yml (用户配置文件,优先级: input > config > default)
      # 支持的 key: exclude_pattern / exclude_repos / size_drop_threshold /
      #            size_check_exempt / max_parallel / sync_mode / webhook_type /
      #            discard_local_changes / protected_skip_repos /
      #            backup_then_sync_repos / legacy_backup_repo /
      #            legacy_backup_branch_prefix / disable_fork_workflows /
      #            disable_fork_workflows_repos /
      #            disable_fork_workflows_keep_patterns
      # =====================================================================
      - name: Read sync config
        id: read-config
        env:
          CONFIG_REPO: ${{ github.event.repository.name }}
        run: scripts/read-config.sh

      # Step 1: 发现 fork
      # =====================================================================
      - name: Discover forks
        id: discover
        env:
          FILTER: ${{ inputs.upstream_owner_filter }}
          # 三段 fallback: input > config > default
          EXCLUDE_REPOS: ${{ inputs.exclude_repos || env.CONFIG_EXCLUDE_REPOS }}
          SIZE_DROP_THRESHOLD: ${{ inputs.size_drop_threshold || env.CONFIG_SIZE_DROP_THRESHOLD || env.DEFAULT_SIZE_DROP_THRESHOLD }}
          SIZE_CHECK_EXEMPT: ${{ inputs.size_check_exempt || env.CONFIG_SIZE_CHECK_EXEMPT || env.DEFAULT_SIZE_CHECK_EXEMPT }}
          MAX_PARALLEL: ${{ inputs.max_parallel || env.CONFIG_MAX_PARALLEL || env.DEFAULT_MAX_PARALLEL }}
          CRON_SCHEDULE: ${{ inputs.cron_schedule }}
          # 多 owner 支持 (Item 17):逗号分隔,留空 = 自己
          TARGET_OWNERS: ${{ inputs.target_owners }}
          # 单仓库/少量仓库测试:逗号分隔,支持 repo 或 owner/repo
          ONLY_REPOS: ${{ inputs.only_repos }}
        run: scripts/discover-forks.sh

      # =====================================================================
      # Step 2: 可选禁用 fork 内 workflows,避免 schedule/push 在目标 fork 里制造新提交。
      # 默认关闭;正式启用前可以配合 dry_run=true 先看将禁用哪些 workflow。
      # =====================================================================
      - name: Disable fork workflows
        env:
          FORKS: ${{ steps.discover.outputs.forks }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIG_REPO: ${{ github.event.repository.name }}
          DISABLE_FORK_WORKFLOWS: ${{ env.CONFIG_DISABLE_FORK_WORKFLOWS || env.DEFAULT_DISABLE_FORK_WORKFLOWS }}
          DISABLE_FORK_WORKFLOWS_REPOS: ${{ inputs.disable_fork_workflows_repos || env.CONFIG_DISABLE_FORK_WORKFLOWS_REPOS || env.DEFAULT_DISABLE_FORK_WORKFLOWS_REPOS }}
          DISABLE_FORK_WORKFLOWS_KEEP_PATTERNS: ${{ inputs.disable_fork_workflows_keep_patterns || env.CONFIG_DISABLE_FORK_WORKFLOWS_KEEP_PATTERNS || env.DEFAULT_DISABLE_FORK_WORKFLOWS_KEEP_PATTERNS }}
        run: scripts/disable-fork-workflows.sh

      # =====================================================================
      # Step 3: 并发同步 fork (脚本化实现,避免 workflow YAML 继续膨胀)
      # =====================================================================
      - name: Sync each fork
        env:
          FORKS: ${{ steps.discover.outputs.forks }}
          MAX_PARALLEL: ${{ inputs.max_parallel || env.CONFIG_MAX_PARALLEL || env.DEFAULT_MAX_PARALLEL }}
          SIZE_DROP_THRESHOLD: ${{ inputs.size_drop_threshold || env.CONFIG_SIZE_DROP_THRESHOLD || env.DEFAULT_SIZE_DROP_THRESHOLD }}
          SIZE_CHECK_EXEMPT: ${{ inputs.size_check_exempt || env.CONFIG_SIZE_CHECK_EXEMPT || env.DEFAULT_SIZE_CHECK_EXEMPT }}
          MAX_BRANCHES_PER_FORK: ${{ inputs.max_branches_per_fork || env.CONFIG_MAX_BRANCHES_PER_FORK || env.DEFAULT_MAX_BRANCHES_PER_FORK }}
          SKIP_BRANCH_PATTERNS: ${{ inputs.skip_branch_patterns || env.CONFIG_SKIP_BRANCH_PATTERNS || env.DEFAULT_SKIP_BRANCH_PATTERNS }}
          FULL_BRANCH_SYNC_REPOS: ${{ inputs.full_branch_sync_repos || env.CONFIG_FULL_BRANCH_SYNC_REPOS || env.DEFAULT_FULL_BRANCH_SYNC_REPOS }}
          BRANCH_LIMIT_GROUPS: ${{ inputs.branch_limit_groups || env.CONFIG_BRANCH_LIMIT_GROUPS || env.DEFAULT_BRANCH_LIMIT_GROUPS }}
          BRANCH_LIMIT_OVERRIDES: ${{ inputs.branch_limit_overrides || env.CONFIG_BRANCH_LIMIT_OVERRIDES || env.DEFAULT_BRANCH_LIMIT_OVERRIDES }}
          PROTECTED_SKIP_REPOS: ${{ env.CONFIG_PROTECTED_SKIP_REPOS || env.DEFAULT_PROTECTED_SKIP_REPOS }}
          BACKUP_THEN_SYNC_REPOS: ${{ env.CONFIG_BACKUP_THEN_SYNC_REPOS || env.DEFAULT_BACKUP_THEN_SYNC_REPOS }}
          LEGACY_BACKUP_REPO: ${{ env.CONFIG_LEGACY_BACKUP_REPO || env.DEFAULT_LEGACY_BACKUP_REPO }}
          LEGACY_BACKUP_BRANCH_PREFIX: ${{ env.CONFIG_LEGACY_BACKUP_BRANCH_PREFIX || env.DEFAULT_LEGACY_BACKUP_BRANCH_PREFIX }}
          DRY_RUN: ${{ inputs.dry_run }}
          SYNC_MODE: ${{ inputs.sync_mode || env.CONFIG_SYNC_MODE || 'auto' }}
          CONFIG_REPO: ${{ github.event.repository.name }}
          DISCARD_LOCAL_CHANGES: ${{ inputs.discard_local_changes || env.CONFIG_DISCARD_LOCAL_CHANGES || env.DEFAULT_DISCARD_LOCAL_CHANGES }}
        run: scripts/sync-each-fork.sh

      # =====================================================================
      # Step 4: Drift 检测 (Item 15)
      # 读 workflow-state 分支上的 .drift-state.json(可能不存在)→ 合并本次结果 →
      # 连续 3 次 fail 的 fork 开 issue 告警 → 写回新 state
      # 跟 sync-config.yml 不同:.drift-state.json 是 workflow 自己管理的状态文件,
      # 但不再写回 main,避免污染配置仓库主分支
      # =====================================================================
      - name: Detect drift
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.event.repository.name }}
        run: scripts/detect-drift.sh

      # =====================================================================
      # Step 5: 汇总到 issue (跑完自动开/更新一个固定 issue 贴汇总)
      # =====================================================================
      - name: Post issue summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.event.repository.name }}
        run: scripts/post-issue-summary.sh

      # =====================================================================
      # Step 6: 发送 webhook 通知 (Slack / 钉钉 / 通用)
      # 推荐用 secrets.WEBHOOK_URL 存 URL,然后这里改成:
      #   WEBHOOK_URL: ${{ secrets.WEBHOOK_URL || inputs.webhook_url }}
      # webhook 失败不影响 workflow 整体结果
      # =====================================================================
      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ inputs.webhook_url }}
          WEBHOOK_TYPE: ${{ inputs.webhook_type || env.CONFIG_WEBHOOK_TYPE || 'slack' }}
          REPO: ${{ github.event.repository.name }}
        run: scripts/send-webhook.sh

      # =====================================================================
      # Step 5: 上传 artifact (Item 12: CSV + JSON 报告留档)
      # if: always() 让失败也留档,方便事后排查
      # 同一个 run 上传两个文件:events.jsonl (原始) + events.csv (易读)
      # 留 30 天 (默认 90,这里 30 够用 + 节省 artifact 存储)
      # =====================================================================
      - name: Upload sync artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-events
          path: |
            ${{ runner.temp }}/events.jsonl
            ${{ runner.temp }}/events.csv
            ${{ runner.temp }}/sync-state.json
          retention-days: 30
          if-no-files-found: warn
