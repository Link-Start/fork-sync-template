# =============================================================================
# GitHub Fork 自动同步工作流 - 动态发现版 (通用模板)
# =============================================================================
# 适用: 自动同步你名下所有 fork 到上游,免维护 fork 列表
# 风格: 动态发现 (auto-discover),不需要 hardcode fork 列表
# 优势: GitHub CLI/API 调用,无需 checkout,自动备份,智能判断 ahead/behind
#
# 跟 .github/workflows/sync-dynamic.yml 的区别:
#   - 本文件 (通用模板): 默认同步所有 fork,不做任何排除
#   - .github/workflows/sync-dynamic.yml (作者日常使用): 自动排除 claude 相关 fork
#
# 启用步骤 (在 fork 后的仓库):
#   1. 把本文件复制到 .github/workflows/sync-dynamic.yml
#      (或自己起名,但要确保在 .github/workflows/ 里才会被 GitHub 自动跑)
#   2. 删掉或改名 .github/workflows/ 里现有的同名 yml (避免冲突)
#   3. 仓库 Settings → Secrets and variables → Actions 新增 FORK_SYNC_TOKEN
#      (PAT,需要目标 fork 的 Contents read/write 权限)
#   4. 仓库 Settings → Actions → General → Workflow permissions 选 "Read and write permissions"
#   5. Actions 标签页点 "I understand my workflows, go ahead and enable them"
#
# 详细文档见 ../docs/ 目录
# =============================================================================

name: Sync All My Forks (Auto Discover, Generic)

on:
  # 改频率:把下面 3 行取消注释你想用的,注释掉不用的 (cron 是 UTC 时间)
  #   '0 0 * * *'    = 每天 00:00 UTC (北京时间 08:00) — 默认
  #   '0 */6 * * *'  = 每 6 小时 (00, 06, 12, 18 UTC)
  #   '0 0 * * 1'    = 每周一 00:00 UTC (北京时间周一 08:00)
  schedule:
    - cron: '0 0 * * *'
    # - cron: '0 */6 * * *'
    # - cron: '0 0 * * 1'
  # 允许 Actions 标签页手动触发
  workflow_dispatch:
    inputs:
      cron_schedule:
        description: '手动触发时填的 cron 表达式,只 log 不影响逻辑 (实际自动 schedule 看上面块)'
        required: false
        default: ''
      upstream_owner_filter:
        description: '只同步这个 owner 旗下的 fork (留空 = 同步所有 fork)'
        required: false
        default: ''
      target_owners:
        description: '要同步的 fork owner 列表 (逗号分隔,留空 = 自己;支持用户名和 org,自动判断)'
        required: false
        default: ''
      only_repos:
        description: '只同步这些 fork 仓库名,逗号分隔;支持 repo 或 owner/repo (留空 = 不限制,适合单仓库测试)'
        required: false
        default: ''
      exclude_repos:
        description: '指定要排除的 fork 名,逗号分隔 (留空 = 不排除指定 fork)'
        required: false
        default: ''
      size_drop_threshold:
        description: '上游体积暴减告警阈值 (上游体积/fork 体积 < 此值触发,默认 0.10 = 10%)'
        required: false
        default: ''
      size_check_exempt:
        description: '豁免 size 检查的 fork 名,逗号分隔 (留空 = 不豁免任何 fork,适用于 1KB CLI 工具之类的小项目)'
        required: false
        default: ''
      max_parallel:
        description: '最大并发数 (默认 4,推荐 2-8,过高会触发 API 限流)'
        required: false
        default: ''
      max_branches_per_fork:
        description: '每个 fork 最多同步 upstream 分支数 (默认 6;0 = 不限制)'
        required: false
        default: ''
      skip_branch_patterns:
        description: '跳过 upstream 分支 glob,逗号分隔 (默认跳过 backup/local-backup/sync-upstream/dependabot)'
        required: false
        default: ''
      full_branch_sync_repos:
        description: '这些 fork 同步全部 upstream 分支,逗号分隔;支持 repo 或 owner/repo'
        required: false
        default: ''
      branch_limit_groups:
        description: '按分支数分组指定 fork,格式 3:repo-a,repo-b;10:owner/repo-c;0:repo-d'
        required: false
        default: ''
      branch_limit_overrides:
        description: '按仓库指定任意分支上限,格式 repo=12,owner/repo=20;0 = 不限制'
        required: false
        default: ''
      dry_run:
        description: '干跑模式 (true = 只看不动,只打 log 不真写,默认 false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      sync_mode:
        description: '同步模式 (auto = 自动同步;pr = 开 PR 让人审,只对 behind 状态有效)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - pr
      webhook_url:
        description: '完成后通知的 webhook URL (留空 = 不通知;支持 Slack / 钉钉 / 通用,看 webhook_type)'
        required: false
        default: ''
      webhook_type:
        description: 'webhook 类型 (slack / dingtalk / generic)'
        required: false
        default: 'slack'
        type: choice
        options:
          - slack
          - dingtalk
          - generic
      discard_local_changes:
        description: 'upstream 有新增且 fork 有本地提交时的处理方式'
        required: false
        default: 'force'
        type: choice
        options:
          - force
          - keep

# 显式声明需要写权限
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-all:
    runs-on: ubuntu-latest
    env:
      MY_OWNER: ${{ github.repository_owner }}
      # 多仓库同步请配置 FORK_SYNC_TOKEN (PAT);否则通常只能写当前配置仓库。
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      # 通用模板默认不设阈值,让 forker 手动触发时填
      # 推荐 0.10 (敏感) 或 0.30 (宽松),0 = 关闭
      DEFAULT_SIZE_DROP_THRESHOLD: '0.10'
      # 通用模板默认并发数,forker 可调
      DEFAULT_MAX_PARALLEL: '4'
      # 通用模板默认每个 fork 最多处理的 upstream 分支数
      # 6 = 先处理默认分支 + 前 5 个其他分支,避免多分支仓库打爆 API
      # 0 = 不限制 (只建议在单仓库测试或白名单里使用)
      DEFAULT_MAX_BRANCHES_PER_FORK: '6'
      # 默认跳过自动生成/备份类 upstream 分支
      # 默认分支永远优先处理,不受这里影响
      DEFAULT_SKIP_BRANCH_PATTERNS: 'backup/*,local-backup/*,sync-upstream/*,dependabot/*'
      # 特定 fork 分支上限口子 (逗号分隔,支持 repo 或 owner/repo)
      DEFAULT_FULL_BRANCH_SYNC_REPOS: ''
      # 任意分组口子: 3:repo-a,repo-b;10:owner/repo-c;0:repo-d
      DEFAULT_BRANCH_LIMIT_GROUPS: ''
      # 任意 N 口子: repo=12,owner/repo=20;值为 0 表示该 repo 不限制
      DEFAULT_BRANCH_LIMIT_OVERRIDES: ''
      # 通用模板默认不豁免 size 检查,让 forker 手动触发时填
      # 推荐 1KB CLI 工具之类的小项目加这里
      DEFAULT_SIZE_CHECK_EXEMPT: ''
      # upstream 有新增且 fork 有本地提交时的处理方式
      # force = 去重备份本地修改后,执行 GitHub Discard commits,和 upstream 完全一致 (默认)
      # keep  = 去重备份本地修改后,使用 merge-upstream 合并上游更新
      # 纯 ahead 且 upstream 无新增时跳过,不备份也不写分支
      DEFAULT_DISCARD_LOCAL_CHANGES: 'force'
    steps:
      # =====================================================================
      # Step 0: 准备共享函数
      # 保持"无需 checkout"架构: 不依赖仓库工作区里的脚本文件。
      # =====================================================================
      - name: Prepare shared helpers
        run: |
          set -e
          cat > "$RUNNER_TEMP/sync-lib.sh" <<'SYNC_LIB'
          #!/usr/bin/env bash

          wait_for_core_rate_limit() {
            local info remaining reset limit now wait reset_human
            info=$(gh api rate_limit \
              --jq '{remaining: .resources.core.remaining, reset: .resources.core.reset, limit: .resources.core.limit}' \
              2>/dev/null || echo '{}')
            remaining=$(echo "$info" | jq -r '.remaining // 9999')
            reset=$(echo "$info" | jq -r '.reset // 0')
            limit=$(echo "$info" | jq -r '.limit // 5000')
            if [ "$remaining" -le 0 ] 2>/dev/null; then
              now=$(date +%s)
              wait=$((reset - now + 10))
              if [ "$wait" -gt 0 ] && [ "$wait" -lt 3700 ]; then
                reset_human=$(date -d "@$reset" '+%H:%M:%S' 2>/dev/null || date -r "$reset" '+%H:%M:%S')
                echo "  ⏸️ GitHub API rate limit 已用尽 ($remaining/$limit),等待 ${wait}s 到 $reset_human UTC" >&2
                sleep "$wait"
                return 0
              fi
            fi
            return 1
          }
          export -f wait_for_core_rate_limit

          gh_api_with_retry() {
            local max_attempts=3
            local attempt=1
            local delay=1
            local output rc
            while [ "$attempt" -le "$max_attempts" ]; do
              output=$(gh api "$@" 2>&1)
              rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "$output"
                return 0
              fi
              if printf '%s' "$output" | grep -Eiq 'rate limit|API rate limit exceeded'; then
                wait_for_core_rate_limit && continue
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "  ⚠️ gh api 失败 (第 $attempt/$max_attempts 次),${delay}s 后重试: $(printf '%s' "$output" | head -1)" >&2
                sleep "$delay"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            if [ -n "${GH_API_ERROR_FILE:-}" ]; then
              printf '%s\n' "$output" > "$GH_API_ERROR_FILE" 2>/dev/null || true
            fi
            echo "  ❌ gh api 最终失败 (3 次都失败): $(printf '%s' "$output" | head -1)" >&2
            return 1
          }
          export -f gh_api_with_retry

          gh_api_capture() {
            local __out_var="$1" __err_var="$2"
            shift 2
            local output rc error_file stderr_file error_output
            error_file=$(mktemp)
            stderr_file=$(mktemp)
            output=$(GH_API_ERROR_FILE="$error_file" gh_api_with_retry "$@" 2>"$stderr_file")
            rc=$?
            printf -v "$__out_var" '%s' "$output"
            if [ "$rc" -ne 0 ]; then
              if [ -s "$error_file" ]; then
                error_output=$(cat "$error_file")
              else
                error_output=$(cat "$stderr_file")
              fi
              printf -v "$__err_var" '%s' "$error_output"
            else
              printf -v "$__err_var" '%s' ""
            fi
            rm -f "$error_file" "$stderr_file"
            return "$rc"
          }
          export -f gh_api_capture

          gh_api_write() {
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[DRY-RUN] gh api $*"
              return 0
            fi
            gh_api_with_retry "$@"
          }
          export -f gh_api_write

          gh_api_write_capture() {
            local __out_var="$1" __err_var="$2"
            shift 2
            if [ "${DRY_RUN:-false}" = "true" ]; then
              printf -v "$__out_var" '[DRY-RUN] gh api %s' "$*"
              printf -v "$__err_var" '%s' ""
              return 0
            fi
            gh_api_capture "$__out_var" "$__err_var" "$@"
          }
          export -f gh_api_write_capture

          log_event() {
            local fork="$1" action="$2" result="$3"
            shift 3
            local extra_json="{}"
            if [ "$#" -gt 0 ]; then
              extra_json=$(printf '%s\n' "$@" | jq -R 'split("=") | {(.[0]): (.[1:] | join("="))}' | jq -s 'add')
            fi
            jq -n -c \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
              --arg fork "$fork" \
              --arg action "$action" \
              --arg result "$result" \
              --arg mode "${SYNC_MODE:-direct}" \
              --arg run_id "${GITHUB_RUN_ID:-local}" \
              --argjson extra "$extra_json" \
              '{ts: $ts, fork: $fork, action: $action, result: $result, mode: $mode, run_id: $run_id} + $extra' \
              >> "${RUNNER_TEMP:-/tmp}/events.jsonl" 2>/dev/null || true
          }
          export -f log_event
          SYNC_LIB

      # =====================================================================
      # Step 0: 读 .github/sync-config.yml (用户配置文件,优先级: input > config > default)
      # 支持的 key: exclude_pattern / exclude_repos / size_drop_threshold /
      #            size_check_exempt / max_parallel / sync_mode / webhook_type /
      #            discard_local_changes
      # =====================================================================
      - name: Read sync config
        id: read-config
        env:
          CONFIG_REPO: ${{ github.event.repository.name }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          CONFIG_YAML=$(gh_api_with_retry "repos/$MY_OWNER/$CONFIG_REPO/contents/.github/sync-config.yml" \
                        --jq '.content // ""' 2>/dev/null | base64 -d 2>/dev/null || echo "")

          if [ -z "$CONFIG_YAML" ]; then
            echo "📄 未找到 .github/sync-config.yml,用默认配置"
            exit 0
          fi

          echo "📄 找到 .github/sync-config.yml,加载覆盖:"
          for KEY in exclude_pattern exclude_repos size_drop_threshold size_check_exempt \
                     max_parallel max_branches_per_fork skip_branch_patterns full_branch_sync_repos \
                     branch_limit_groups branch_limit_overrides sync_mode webhook_type \
                     discard_local_changes; do
            VAL=$(echo "$CONFIG_YAML" | grep -E "^${KEY}:" | head -1 \
                  | sed -E "s/^${KEY}:[[:space:]]*//" \
                  | sed 's/^["'"'"']//;s/["'"'"']$//' || echo "")
            if [ -n "$VAL" ]; then
              echo "  ✓ $KEY = $VAL"
              echo "CONFIG_${KEY^^}=${VAL}" >> "$GITHUB_ENV"
            fi
          done

      # Step 1: 发现 fork
      # =====================================================================
      - name: Discover forks
        id: discover
        env:
          FILTER: ${{ inputs.upstream_owner_filter }}
          # 三段 fallback: input > config > default
          EXCLUDE_REPOS: ${{ inputs.exclude_repos || env.CONFIG_EXCLUDE_REPOS }}
          SIZE_DROP_THRESHOLD: ${{ inputs.size_drop_threshold || env.CONFIG_SIZE_DROP_THRESHOLD || env.DEFAULT_SIZE_DROP_THRESHOLD }}
          SIZE_CHECK_EXEMPT: ${{ inputs.size_check_exempt || env.CONFIG_SIZE_CHECK_EXEMPT || env.DEFAULT_SIZE_CHECK_EXEMPT }}
          MAX_PARALLEL: ${{ inputs.max_parallel || env.CONFIG_MAX_PARALLEL || env.DEFAULT_MAX_PARALLEL }}
          CRON_SCHEDULE: ${{ inputs.cron_schedule }}
          # 多 owner 支持 (Item 17):逗号分隔,留空 = 自己
          TARGET_OWNERS: ${{ inputs.target_owners }}
          # 单仓库/少量仓库测试:逗号分隔,支持 repo 或 owner/repo
          ONLY_REPOS: ${{ inputs.only_repos }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          json_lines_to_array() {
            if [ -n "$1" ]; then
              printf '%s\n' "$1" | jq -s '.'
            else
              echo "[]"
            fi
          }

          list_authenticated_owner_fork_candidates() {
            local lines
            if lines=$(gh_api_with_retry --paginate 'user/repos?per_page=100&type=owner&sort=updated' \
              --jq ".[] | select(.fork == true and .owner.login == \"$MY_OWNER\") | {name: .name, fork_owner: .owner.login}" 2>/dev/null); then
              json_lines_to_array "$lines"
            else
              echo "[]"
            fi
          }

          list_named_owner_fork_candidates() {
            local owner="$1"
            local lines

            if lines=$(gh_api_with_retry --paginate "users/$owner/repos?per_page=100&type=owner&sort=updated" \
              --jq '.[] | select(.fork == true) | {name: .name, fork_owner: .owner.login}' 2>/dev/null); then
              echo "  ✓ $owner (user/public endpoint)" >&2
              json_lines_to_array "$lines"
              return 0
            fi

            if lines=$(gh_api_with_retry --paginate "orgs/$owner/repos?per_page=100&sort=updated" \
              --jq '.[] | select(.fork == true) | {name: .name, fork_owner: .owner.login}' 2>/dev/null); then
              echo "  ✓ $owner (org endpoint)" >&2
              json_lines_to_array "$lines"
              return 0
            fi

            echo "  ⚠️ $owner: 既不是 user 也不是 org (或无权访问),跳过" >&2
            echo "[]"
            return 1
          }

          enrich_fork_candidates() {
            local candidates="$1"
            local candidate_count
            candidate_count=$(echo "$candidates" | jq length)
            if [ "$candidate_count" -eq 0 ]; then
              echo "[]"
              return 0
            fi

            echo "  ↳ 补齐 $candidate_count 个 fork 的 upstream 信息" >&2
            while IFS= read -r fork_json; do
              local fork_owner fork_name detail
              fork_owner=$(echo "$fork_json" | jq -r '.fork_owner')
              fork_name=$(echo "$fork_json" | jq -r '.name')

              if detail=$(gh_api_with_retry "repos/$fork_owner/$fork_name" 2>/dev/null); then
                if echo "$detail" | jq -e '.fork == true' >/dev/null 2>&1; then
                  echo "$detail" | jq -c '{
                    name: .name,
                    fork_owner: .owner.login,
                    fork_default_branch: (.default_branch // "main"),
                    parent_name: (.parent.name // ""),
                    parent_owner: (.parent.owner.login // ""),
                    parent_default_branch: (.parent.default_branch // ""),
                    upstream_unavailable_reason: (if .parent == null then "parent 信息不可用: 上游仓库可能已删除、私有化、改名或 fork 关系失效" else "" end)
                  }'
                else
                  echo "  ⚠️ $fork_owner/$fork_name: 不是 fork 或 fork 信息不可用,跳过" >&2
                fi
              else
                echo "  ⚠️ $fork_owner/$fork_name: 仓库详情不可访问,跳过" >&2
              fi
            done < <(echo "$candidates" | jq -c '.[]') | jq -s '.'
          }

          only_repo_candidates() {
            echo "$ONLY_REPOS" | jq -R '
              split(",")
              | map(gsub("^ +| +$"; ""))
              | map(select(length > 0))
              | map(
                  if contains("/") then
                    split("/") | {fork_owner: .[0], name: .[1]}
                  else
                    {fork_owner: env.MY_OWNER, name: .}
                  end
                )
            '
          }

          # 收集 fork 列表:列表 API 只保证有 fork=true,不保证带 parent/source。
          # 所以先分页拿候选,再逐个 GET /repos/{owner}/{repo} 补齐 upstream。
          FORKS="[]"
          if [ -n "$ONLY_REPOS" ]; then
            echo "🎯 only_repos 快速模式: 只查询指定 fork,不扫描全量账号 → $ONLY_REPOS"
            CANDIDATES=$(only_repo_candidates)
            FORKS=$(enrich_fork_candidates "$CANDIDATES")
          elif [ -z "$TARGET_OWNERS" ]; then
            echo "🌐 默认 owner: $MY_OWNER"
            AUTH_CANDIDATES=$(list_authenticated_owner_fork_candidates)
            PUBLIC_CANDIDATES=$(list_named_owner_fork_candidates "$MY_OWNER" || true)
            CANDIDATES=$(jq -s 'add | unique_by(.fork_owner + "/" + .name)' \
              <(echo "$AUTH_CANDIDATES") <(echo "$PUBLIC_CANDIDATES"))
            FORKS=$(enrich_fork_candidates "$CANDIDATES")
          else
            OWNER_LIST=$(echo "$TARGET_OWNERS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$')
            OWNER_COUNT=$(echo "$OWNER_LIST" | wc -l | tr -d ' ')
            echo "🌐 多 owner 模式: $OWNER_COUNT 个 owner → $(echo $OWNER_LIST | tr '\n' ',' | sed 's/,$//')"
            for owner in $OWNER_LIST; do
              CANDIDATES=$(list_named_owner_fork_candidates "$owner" || true)
              FORK_BATCH=$(enrich_fork_candidates "$CANDIDATES")
              FORKS=$(jq -s 'add | unique_by(.fork_owner + "/" + .name)' <(echo "$FORKS") <(echo "$FORK_BATCH"))
            done
          fi

          if [ -n "$FILTER" ]; then
            FORKS=$(echo "$FORKS" | jq --arg f "$FILTER" '[.[] | select(.parent_owner == $f)]')
            echo "🔍 正向过滤: 只保留 parent_owner == $FILTER"
          fi

          # 反向过滤: 排除指定名称的 fork (精确匹配,逗号分隔)
          if [ -n "$EXCLUDE_REPOS" ]; then
            # 把 "a, b ,c" 转成 ["a","b","c"] 这样的 JSON 数组
            EXCLUDE_JSON=$(echo "$EXCLUDE_REPOS" | jq -R 'split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0))')
            EXCLUDE_COUNT=$(echo "$EXCLUDE_JSON" | jq length)
            FORKS=$(echo "$FORKS" | jq --argjson excl "$EXCLUDE_JSON" \
              '[.[] | select(.name as $n | $excl | index($n) == null)]')
            echo "🚫 指定排除: $EXCLUDE_COUNT 个 fork → $EXCLUDE_REPOS"
          fi

          COUNT=$(echo "$FORKS" | jq length)
          if [ -n "$ONLY_REPOS" ] && [ "$COUNT" -eq 0 ]; then
            echo "::error::only_repos 没匹配到任何 fork: $ONLY_REPOS"
            echo "  提示:填 fork 仓库名,例如 lanhu-mcp_dsphper; 多 owner 时也可填 Link-Start/lanhu-mcp_dsphper"
            exit 1
          fi
          echo "forks<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FORKS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ 没找到任何符合条件的 fork"
            exit 0
          fi

          echo "🔍 发现 $COUNT 个 fork 待同步"
          echo "$FORKS" | jq -r '.[] | "  - \(.name) ← \(.parent_owner)/\(.parent_name)"'

          # 手动触发时 echo 用户填的 cron_schedule (自动 schedule 走 schedule 块)
          if [ -n "$CRON_SCHEDULE" ]; then
            echo "🕐 手动触发,模拟 cron: $CRON_SCHEDULE"
          fi

      # =====================================================================
      # Step 2: 并发同步 fork (5 阶段执行流程,每 fork 一份 log)
      # =====================================================================
      - name: Sync each fork
        env:
          FORKS: ${{ steps.discover.outputs.forks }}
          MAX_PARALLEL: ${{ inputs.max_parallel || env.CONFIG_MAX_PARALLEL || env.DEFAULT_MAX_PARALLEL }}
          SIZE_DROP_THRESHOLD: ${{ inputs.size_drop_threshold || env.CONFIG_SIZE_DROP_THRESHOLD || env.DEFAULT_SIZE_DROP_THRESHOLD }}
          SIZE_CHECK_EXEMPT: ${{ inputs.size_check_exempt || env.CONFIG_SIZE_CHECK_EXEMPT || env.DEFAULT_SIZE_CHECK_EXEMPT }}
          MAX_BRANCHES_PER_FORK: ${{ inputs.max_branches_per_fork || env.CONFIG_MAX_BRANCHES_PER_FORK || env.DEFAULT_MAX_BRANCHES_PER_FORK }}
          SKIP_BRANCH_PATTERNS: ${{ inputs.skip_branch_patterns || env.CONFIG_SKIP_BRANCH_PATTERNS || env.DEFAULT_SKIP_BRANCH_PATTERNS }}
          FULL_BRANCH_SYNC_REPOS: ${{ inputs.full_branch_sync_repos || env.CONFIG_FULL_BRANCH_SYNC_REPOS || env.DEFAULT_FULL_BRANCH_SYNC_REPOS }}
          BRANCH_LIMIT_GROUPS: ${{ inputs.branch_limit_groups || env.CONFIG_BRANCH_LIMIT_GROUPS || env.DEFAULT_BRANCH_LIMIT_GROUPS }}
          BRANCH_LIMIT_OVERRIDES: ${{ inputs.branch_limit_overrides || env.CONFIG_BRANCH_LIMIT_OVERRIDES || env.DEFAULT_BRANCH_LIMIT_OVERRIDES }}
          DRY_RUN: ${{ inputs.dry_run }}
          SYNC_MODE: ${{ inputs.sync_mode || env.CONFIG_SYNC_MODE || 'auto' }}
          CONFIG_REPO: ${{ github.event.repository.name }}
          DISCARD_LOCAL_CHANGES: ${{ inputs.discard_local_changes || env.CONFIG_DISCARD_LOCAL_CHANGES || env.DEFAULT_DISCARD_LOCAL_CHANGES }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          # 每 fork 单独 log 文件,避免并发输出错乱
          LOG_DIR=$(mktemp -d)
          trap 'rm -rf "$LOG_DIR"' EXIT

          # 清空旧 events (新 run 重新开始)
          : > "$RUNNER_TEMP/events.jsonl"
          : > "$RUNNER_TEMP/summary.jsonl"

          if ! echo "$FORKS" | jq -e 'type == "array"' >/dev/null 2>&1; then
            echo "::error::Discover forks 输出不是 JSON array"
            exit 1
          fi
          FORK_COUNT=$(echo "$FORKS" | jq length)
          if [ "$FORK_COUNT" -eq 0 ]; then
            echo "⏭️  没有 fork 待同步"
            exit 0
          fi
          if ! printf '%s' "$MAX_PARALLEL" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::warning::max_parallel='$MAX_PARALLEL' 非法,回退到 4"
            MAX_PARALLEL=4
          fi
          if ! printf '%s' "$SIZE_DROP_THRESHOLD" | grep -Eq '^(0|[0-9]+([.][0-9]+)?)$'; then
            echo "::warning::size_drop_threshold='$SIZE_DROP_THRESHOLD' 非法,回退到 0.10"
            SIZE_DROP_THRESHOLD=0.10
          fi
          if ! printf '%s' "$MAX_BRANCHES_PER_FORK" | grep -Eq '^(0|[1-9][0-9]*)$'; then
            echo "::warning::max_branches_per_fork='$MAX_BRANCHES_PER_FORK' 非法,回退到 6"
            MAX_BRANCHES_PER_FORK=6
          fi
          DISCARD_LOCAL_CHANGES_RAW="${DISCARD_LOCAL_CHANGES:-force}"
          DISCARD_LOCAL_CHANGES=$(printf '%s' "$DISCARD_LOCAL_CHANGES_RAW" \
            | sed -E 's/[[:space:]]+#.*$//; s/^ +| +$//g' \
            | tr '[:upper:]' '[:lower:]')
          case "$DISCARD_LOCAL_CHANGES" in
            force|keep) ;;
            *)
              echo "::warning::discard_local_changes='$DISCARD_LOCAL_CHANGES_RAW' 非法,回退到 force"
              DISCARD_LOCAL_CHANGES=force
              ;;
          esac
          echo "🧭 本地分歧处理模式: $DISCARD_LOCAL_CHANGES"
          echo "🌿 默认分支同步上限: $MAX_BRANCHES_PER_FORK (0 = 不限制)"

          SKIP_LIST=$(gh_api_with_retry "repos/$MY_OWNER/$CONFIG_REPO/contents/skip.txt" \
                      --jq '.content // ""' 2>/dev/null \
                      | base64 -d 2>/dev/null \
                      | sed 's/^ *//;s/ *$//' \
                      | grep -v '^#' \
                      | grep -v '^$' || true)
          export SKIP_LIST

          # 单 fork 处理函数 (被 xargs -P 并发调用)
          # 每个调用重定向输出到独立 log 文件,最后按原顺序拼接
          process_fork() {
            local fork_b64="$1"
            local fork_json
            local FORK_REPO UPSTREAM_OWNER UPSTREAM_REPO UPSTREAM_DEFAULT FORK_DEFAULT UPSTREAM_UNAVAILABLE_REASON
            local FORK_NAME
            fork_json=$(printf '%s' "$fork_b64" | base64 -d 2>/dev/null || echo "")
            if [ -z "$fork_json" ] || ! echo "$fork_json" | jq -e 'type == "object"' >/dev/null 2>&1; then
              echo "::warning::收到非法 fork 参数,跳过"
              return 0
            fi
            FORK_NAME=$(echo "$fork_json" | jq -r '.name')
            local log_file="$LOG_DIR/${FORK_NAME}.log"
            exec > "$log_file" 2>&1

            FORK_REPO=$(echo "$fork_json" | jq -r '.name')
            # fork_owner 是 Item 17 多 owner 引入的字段;老数据没有就 fallback 到 MY_OWNER
            FORK_OWNER=$(echo "$fork_json" | jq -r '.fork_owner // empty')
            FORK_OWNER="${FORK_OWNER:-$MY_OWNER}"
            UPSTREAM_OWNER=$(echo "$fork_json" | jq -r '.parent_owner')
            UPSTREAM_REPO=$(echo "$fork_json" | jq -r '.parent_name')
            UPSTREAM_DEFAULT=$(echo "$fork_json" | jq -r '.parent_default_branch')
            FORK_DEFAULT=$(echo "$fork_json" | jq -r '.fork_default_branch // "main"')
            UPSTREAM_UNAVAILABLE_REASON=$(echo "$fork_json" | jq -r '.upstream_unavailable_reason // empty')
            local SYNCED=() FAILED=() NEW=() SKIPPED=() LOCAL_BACKED_UP=() FAILURE_DETAILS=()

            csv_lines() {
              printf '%s' "$1" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' || true
            }

            repo_in_csv() {
              local list="$1"
              [ -z "$list" ] && return 1
              csv_lines "$list" | grep -Fxq "$FORK_REPO" && return 0
              csv_lines "$list" | grep -Fxq "$FORK_OWNER/$FORK_REPO"
            }

            branch_matches_pattern() {
              local branch="$1" patterns="$2" pattern
              [ -z "$patterns" ] && return 1
              while IFS= read -r pattern; do
                [ -z "$pattern" ] && continue
                case "$branch" in
                  $pattern) return 0 ;;
                esac
              done < <(csv_lines "$patterns")
              return 1
            }

            branch_limit_override_for_repo() {
              local overrides="$1" item key val repo_full="$FORK_OWNER/$FORK_REPO"
              [ -z "$overrides" ] && return 1
              while IFS= read -r item; do
                [ -z "$item" ] && continue
                case "$item" in
                  *=*) ;;
                  *) continue ;;
                esac
                key=${item%%=*}
                val=${item#*=}
                key=$(printf '%s' "$key" | sed 's/^ *//;s/ *$//')
                val=$(printf '%s' "$val" | sed 's/^ *//;s/ *$//')
                if { [ "$key" = "$FORK_REPO" ] || [ "$key" = "$repo_full" ]; } && \
                   printf '%s' "$val" | grep -Eq '^(0|[1-9][0-9]*)$'; then
                  printf '%s\n' "$val"
                  return 0
                fi
              done < <(csv_lines "$overrides")
              return 1
            }

            branch_limit_group_for_repo() {
              local groups="$1" group limit repos repo_full="$FORK_OWNER/$FORK_REPO"
              [ -z "$groups" ] && return 1
              while IFS= read -r group; do
                group=$(printf '%s' "$group" | sed 's/^ *//;s/ *$//')
                [ -z "$group" ] && continue
                case "$group" in
                  *:*) ;;
                  *) continue ;;
                esac
                limit=${group%%:*}
                repos=${group#*:}
                limit=$(printf '%s' "$limit" | sed 's/^ *//;s/ *$//')
                if ! printf '%s' "$limit" | grep -Eq '^(0|[1-9][0-9]*)$'; then
                  continue
                fi
                if csv_lines "$repos" | grep -Fxq "$FORK_REPO" || \
                   csv_lines "$repos" | grep -Fxq "$repo_full"; then
                  printf '%s\n' "$limit"
                  return 0
                fi
              done < <(printf '%s\n' "$groups" | tr ';' '\n')
              return 1
            }

            first_json_line() {
              awk 'match($0, /^\{.*\}/) {print substr($0, RSTART, RLENGTH); exit}' <<<"$1"
            }

            api_error_field() {
              local raw="$1" field="$2" json
              json=$(first_json_line "$raw")
              if [ -n "$json" ]; then
                jq -r --arg field "$field" '.[$field] // empty' <<<"$json" 2>/dev/null | head -1
              fi
            }

            api_error_message() {
              local raw="$1" message
              message=$(api_error_field "$raw" "message")
              if [ -z "$message" ]; then
                message=$(sed -n 's/^gh: //p' <<<"$raw" | head -1)
              fi
              if [ -z "$message" ]; then
                message=$(head -1 <<<"$raw")
              fi
              printf '%s' "$message" | tr '\r\n' ' ' | cut -c 1-500
            }

            api_error_hint() {
              local context="$1" status="$2" message="$3"
              case "$context:$status:$message" in
                branches:404:*)
                  printf '%s' "上游仓库分支列表不可访问; 常见原因: 上游仓库被删除、私有化、改名、空仓库或 token 无权限"
                  ;;
                upstream_sha:404:*)
                  printf '%s' "上游分支当前不可读取; 常见原因: 分支已删除/重命名、分支名包含特殊路径导致 ref 查询失败、或 API 列表与 ref 查询之间发生变化"
                  ;;
                fork_sha:404:*)
                  printf '%s' "fork 上没有这个分支; 如果后续创建失败,通常是分支名/SHA/权限问题"
                  ;;
                compare:404:*No\ common\ ancestor*)
                  printf '%s' "fork 分支和 upstream 分支没有共同祖先; 常见原因: fork 分支是独立历史、被强制改写过、或不是从该 upstream 分支派生"
                  ;;
                compare:404:*)
                  printf '%s' "GitHub compare 找不到可比较对象; 常见原因: 上游/fork 分支不存在、仓库不可访问、fork 关系异常或没有共同历史"
                  ;;
                compare:409:*)
                  printf '%s' "GitHub compare 冲突/无法生成比较结果; 需要人工确认该分支历史"
                  ;;
                create_ref:422:*Reference\ already\ exists*)
                  printf '%s' "目标分支已存在; 可能是并发运行或上一次运行刚创建"
                  ;;
                create_ref:422:*)
                  printf '%s' "GitHub 拒绝创建分支; 常见原因: 分支名非法、SHA 不存在、仓库规则限制或参数校验失败"
                  ;;
                create_ref:403:*)
                  printf '%s' "没有创建分支权限,或仓库规则禁止创建该 ref"
                  ;;
                update_ref:403:*|discard:403:*|merge_keep:403:*|merge_upstream:403:*)
                  printf '%s' "没有更新分支权限,或分支保护/仓库规则阻止写入"
                  ;;
                update_ref:422:*|discard:422:*)
                  printf '%s' "GitHub 拒绝强制更新 ref; 常见原因: 参数校验失败、分支保护、SHA 无效或仓库规则限制"
                  ;;
                merge_upstream:409:*|merge_keep:409:*)
                  printf '%s' "merge-upstream 发生冲突,不能自动合并"
                  ;;
                *:404:*)
                  printf '%s' "GitHub 返回 404; 通常是仓库/分支不存在、已删除/私有化、改名或 token 无权限"
                  ;;
                *:403:*)
                  printf '%s' "GitHub 返回 403; 通常是 token 权限不足、分支保护、仓库规则或 API 限制"
                  ;;
                *:422:*)
                  printf '%s' "GitHub 返回 422; 通常是请求参数无效、ref/SHA 不合法、分支已存在或仓库规则校验失败"
                  ;;
                *)
                  printf '%s' "GitHub API 调用失败; 需要结合原始 message 判断"
                  ;;
              esac
            }

            record_failure() {
              local branch="$1" reason="$2" context="${3:-}" api_path="${4:-}" api_error="${5:-}" event_mode="${6:-}"
              local api_status api_message api_doc hint detail_json
              api_status=$(api_error_field "$api_error" "status")
              api_doc=$(api_error_field "$api_error" "documentation_url")
              api_message=$(api_error_message "$api_error")
              hint=$(api_error_hint "$context" "$api_status" "$api_message")

              FAILED+=("$branch")
              detail_json=$(jq -n -c \
                --arg branch "$branch" \
                --arg reason "$reason" \
                --arg context "$context" \
                --arg api_path "$api_path" \
                --arg api_status "$api_status" \
                --arg api_message "$api_message" \
                --arg api_doc "$api_doc" \
                --arg hint "$hint" \
                --arg mode "$event_mode" \
                '{branch: $branch, reason: $reason, context: $context, api_path: $api_path, api_status: $api_status, api_message: $api_message, api_doc: $api_doc, hint: $hint, mode: $mode}')
              FAILURE_DETAILS+=("$detail_json")

              echo "    详情: $hint"
              if [ -n "$api_status" ] || [ -n "$api_message" ]; then
                echo "    GitHub: HTTP ${api_status:-unknown} - ${api_message:-unknown}"
              fi
              log_event "$FORK_REPO" "sync_branch" "fail" \
                branch="$branch" reason="$reason" context="$context" api_path="$api_path" \
                api_status="$api_status" api_message="$api_message" hint="$hint" mode="$event_mode"
            }

            write_fork_summary() {
              local result="$1"
              local reason="${2:-}"
              local failure_details_json="[]" failure_summary=""
              if [ "${#FAILED[@]}" -gt 0 ]; then
                result="fail"
              fi
              if [ "${#FAILURE_DETAILS[@]}" -gt 0 ]; then
                failure_details_json=$(printf '%s\n' "${FAILURE_DETAILS[@]}" | jq -s '.')
                failure_summary=$(printf '%s\n' "${FAILURE_DETAILS[0]}" | jq -r '
                  .reason
                  + (if .api_status != "" then " (HTTP " + .api_status + ")" else "" end)
                  + (if .hint != "" then ": " + .hint else "" end)
                ' | cut -c 1-300)
              fi
              if [ -z "$reason" ] && [ -n "$failure_summary" ]; then
                reason="$failure_summary"
              fi

              echo ""
              echo "  📊 $FORK_REPO: result=$result 🆕${#NEW[@]} ✅${#SYNCED[@]} ❌${#FAILED[@]} ⏭️${#SKIPPED[@]} 📦${#LOCAL_BACKED_UP[@]}"

              log_event "$FORK_REPO" "fork_complete" "$result" \
                new="${#NEW[@]}" synced="${#SYNCED[@]}" failed="${#FAILED[@]}" \
                skipped="${#SKIPPED[@]}" local_backup="${#LOCAL_BACKED_UP[@]}" reason="$reason"

              jq -n -c \
                --arg name "$FORK_REPO" \
                --arg result "$result" \
                --arg reason "$reason" \
                --argjson new "${#NEW[@]}" \
                --argjson synced "${#SYNCED[@]}" \
                --argjson failed "${#FAILED[@]}" \
                --argjson skipped "${#SKIPPED[@]}" \
                --argjson local_backup "${#LOCAL_BACKED_UP[@]}" \
                --argjson failure_details "$failure_details_json" \
                --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{name: $name, result: $result, reason: $reason, new: $new, synced: $synced, failed: $failed, skipped: $skipped, local_backup: $local_backup, failure_details: $failure_details, ts: $ts}' \
                >> "$RUNNER_TEMP/summary.jsonl"
            }

            latest_local_backup_branch() {
              local source_branch="$1"
              local prefix="local-backup/${source_branch}-"
              gh_api_with_retry "repos/$FORK_OWNER/$FORK_REPO/git/matching-refs/heads/$prefix" \
                --jq '.[].ref' 2>/dev/null \
                | sed 's|^refs/heads/||' \
                | awk -v prefix="$prefix" 'index($0, prefix) == 1 {
                    rest = substr($0, length(prefix) + 1)
                    if (rest ~ /^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$/) print
                  }' \
                | sort -r \
                | head -1 || true
            }

            ensure_protective_local_backup() {
              local source_branch="$1" reason="$2"
              local fork_sha fork_sha_err fork_sha_api backup_branch latest latest_sha
              local backup_out backup_err backup_api
              fork_sha_api="repos/$FORK_OWNER/$FORK_REPO/git/ref/heads/$source_branch"
              if ! gh_api_capture fork_sha fork_sha_err "$fork_sha_api" --jq '.object.sha'; then
                fork_sha=""
              fi
              if [ -z "$fork_sha" ]; then
                echo "    ❌ 保护备份失败: fork 分支不存在或不可读取 ($source_branch)"
                record_failure "$source_branch" "保护备份失败: fork 分支不存在或不可读取" "fork_sha" "$fork_sha_api" "$fork_sha_err" "protective_backup"
                return 1
              fi

              latest=$(latest_local_backup_branch "$source_branch")
              if [ -n "$latest" ]; then
                latest_sha=$(gh_api_with_retry "repos/$FORK_OWNER/$FORK_REPO/git/ref/heads/$latest" \
                             --jq '.object.sha' 2>/dev/null || echo "")
                if [ "$latest_sha" = "$fork_sha" ]; then
                  echo "    📦 已有同 SHA 保护备份: $latest → ${fork_sha:0:7}"
                  LOCAL_BACKED_UP+=("$source_branch:$latest")
                  log_event "$FORK_REPO" "local_backup" "skip" branch="$source_branch" backup_branch="$latest" reason="已有同 SHA 保护备份" sha="${fork_sha:0:7}"
                  return 0
                fi
              fi

              backup_branch="local-backup/${source_branch}-$(date +%Y%m%d-%H%M%S)-${fork_sha:0:7}"
              backup_api="repos/$FORK_OWNER/$FORK_REPO/git/refs"
              if gh_api_write_capture backup_out backup_err -X POST "$backup_api" \
                   -f ref="refs/heads/$backup_branch" \
                   -f sha="$fork_sha" >/dev/null 2>&1; then
                echo "    📦 保护备份: $backup_branch → ${fork_sha:0:7}"
                LOCAL_BACKED_UP+=("$source_branch:$backup_branch")
                log_event "$FORK_REPO" "local_backup" "ok" branch="$source_branch" backup_branch="$backup_branch" reason="$reason" sha="${fork_sha:0:7}"
                return 0
              fi

              echo "    ❌ 保护备份分支创建失败: $backup_branch"
              log_event "$FORK_REPO" "local_backup" "fail" branch="$source_branch" backup_branch="$backup_branch" reason="$reason" api_status="$(api_error_field "$backup_err" "status")" api_message="$(api_error_message "$backup_err")"
              record_failure "$source_branch" "保护备份分支创建失败" "protective_backup" "$backup_api" "$backup_err" "protective_backup"
              return 1
            }

            protect_and_skip_fork() {
              local reason="$1" detail="$2"
              echo "  🛡️  $reason"
              [ -n "$detail" ] && echo "  $detail"
              ensure_protective_local_backup "$FORK_DEFAULT" "$reason" || true
              log_event "$FORK_REPO" "protective_skip" "skip" reason="$reason" default_branch="$FORK_DEFAULT"
              SKIPPED+=("$FORK_REPO")
              write_fork_summary "skip" "$reason"
              return 0
            }

            fetch_ref_for_signature() {
              local repo_dir="$1"
              local remote="$2"
              local source_ref="$3"
              local target_ref="$4"
              local auth_header="$5"

              git -C "$repo_dir" -c http.extraheader="$auth_header" fetch --quiet --no-tags --depth=1000 \
                "$remote" "$source_ref:$target_ref"
            }

            local_changes_signature() {
              local repo_dir="$1"
              local upstream_ref="$2"
              local head_ref="$3"
              local base sig
              base=$(git -C "$repo_dir" merge-base "$upstream_ref" "$head_ref") || return 1
              sig=$(git -C "$repo_dir" diff --find-renames "$base" "$head_ref" \
                    | git -C "$repo_dir" patch-id --stable \
                    | awk '{print $1}' \
                    | sort \
                    | paste -sd, -)
              printf '%s\n' "${sig:-empty}"
            }

            local_backup_matches_current_changes() {
              local source_branch="$1"
              local backup_branch="$2"
              local tmp auth_header current_sig backup_sig
              tmp=$(mktemp -d) || return 2
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"

              git -C "$tmp" init -q || { rm -rf "$tmp"; return 2; }
              git -C "$tmp" remote add fork "https://github.com/$FORK_OWNER/$FORK_REPO.git"
              git -C "$tmp" remote add upstream "https://github.com/$UPSTREAM_OWNER/$UPSTREAM_REPO.git"

              if ! fetch_ref_for_signature "$tmp" fork "refs/heads/$source_branch" refs/sync/current "$auth_header" || \
                 ! fetch_ref_for_signature "$tmp" fork "refs/heads/$backup_branch" refs/sync/backup "$auth_header"; then
                rm -rf "$tmp"
                return 2
              fi
              if ! fetch_ref_for_signature "$tmp" upstream "refs/heads/$source_branch" refs/sync/upstream "$auth_header"; then
                rm -rf "$tmp"
                return 2
              fi

              current_sig=$(local_changes_signature "$tmp" refs/sync/upstream refs/sync/current) || {
                rm -rf "$tmp"
                return 2
              }
              backup_sig=$(local_changes_signature "$tmp" refs/sync/upstream refs/sync/backup) || {
                rm -rf "$tmp"
                return 2
              }
              rm -rf "$tmp"

              [ "$current_sig" = "$backup_sig" ]
            }

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 $FORK_OWNER/$FORK_REPO ← $UPSTREAM_OWNER/$UPSTREAM_REPO"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ----- 阶段 0: 跳过检查 -----
            local NO_SYNC_JSON SKIP_REASON
            NO_SYNC_JSON=$(gh_api_with_retry "repos/$FORK_OWNER/$FORK_REPO/contents/.github/.no-sync" 2>/dev/null || true)
            if [ -n "$NO_SYNC_JSON" ]; then
              SKIP_REASON=$(echo "$NO_SYNC_JSON" | jq -r '.content // ""' 2>/dev/null | base64 -d 2>/dev/null | head -c 200 || true)
              SKIP_REASON="${SKIP_REASON:-no-sync marker}"
              echo "⏭️  跳过 $FORK_REPO (fork 自带 .github/.no-sync: $SKIP_REASON)"
              SKIPPED+=("$FORK_REPO")
              log_event "$FORK_REPO" "skip_check" "skip" reason=".github/.no-sync"
              write_fork_summary "skip" ".github/.no-sync: $SKIP_REASON"
              return 0
            fi

            if [ -n "$SKIP_LIST" ] && printf '%s\n' "$SKIP_LIST" | grep -qxF "$FORK_REPO"; then
              echo "⏭️  跳过 $FORK_REPO (在 config 仓库 skip.txt 中)"
              SKIPPED+=("$FORK_REPO")
              log_event "$FORK_REPO" "skip_check" "skip" reason="skip.txt"
              write_fork_summary "skip" "skip.txt"
              return 0
            fi

            # ----- 阶段 1: 上游存活检查 -----
            if [ -z "$UPSTREAM_DEFAULT" ]; then
              echo "::warning::上游不可访问 (删除/私有化/改名/fork 关系失效),只备份 fork 后跳过"
              log_event "$FORK_REPO" "upstream_check" "fail" reason="${UPSTREAM_UNAVAILABLE_REASON:-上游不可访问}"
              protect_and_skip_fork "上游不可访问,已保护备份并跳过同步" "${UPSTREAM_UNAVAILABLE_REASON:-疑似源仓库已删除、私有化、改名或 token 无权限}"
              return 0
            fi
            log_event "$FORK_REPO" "upstream_check" "ok" upstream="$UPSTREAM_OWNER/$UPSTREAM_REPO" default_branch="$UPSTREAM_DEFAULT"
            echo "🔍 上游默认分支: $UPSTREAM_DEFAULT"

            # ----- 阶段 1.5: 危险检测 - 上游体积暴减 -----
            # 场景: 上游把源码删了只留 README/说明文件,同步会把 fork 源码也删光
            # 启发: GitHub repo .size 字段 (KB),当 fork 已有实质内容 (>= 50KB)
            #       且 upstream 为空或 upstream 体积/fork 体积 < SIZE_DROP_THRESHOLD 时,跳过整个 fork
            # SIZE_DROP_THRESHOLD 默认 0.10 (=10%,敏感);0.30 宽松;0 关闭
            # SIZE_CHECK_EXEMPT: 逗号分隔的 fork 名白名单,这些 fork 跳过 size 检查
            #                    适用于极小项目 (1KB CLI 工具) 被误杀的情况
            local FORK_SIZE UPSTREAM_SIZE THRESHOLD_PCT SKIP_SIZE_CHECK=false
            # 检查豁免名单 (精确匹配,逗号分隔)
            if [ -n "$SIZE_CHECK_EXEMPT" ] && \
               printf '%s' "$SIZE_CHECK_EXEMPT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -Fxq "$FORK_REPO"; then
              echo "⏭️  豁免 size 检查: $FORK_REPO 在 SIZE_CHECK_EXEMPT 白名单里"
              SKIP_SIZE_CHECK=true
              log_event "$FORK_REPO" "size_check" "exempt" reason="在白名单里"
            fi
            FORK_SIZE=$(gh_api_with_retry "repos/$FORK_OWNER/$FORK_REPO" --jq '.size // 0' 2>/dev/null || echo 0)
            UPSTREAM_SIZE=$(gh_api_with_retry "repos/$UPSTREAM_OWNER/$UPSTREAM_REPO" --jq '.size // 0' 2>/dev/null || echo 0)
            THRESHOLD_PCT=$(awk "BEGIN {printf \"%.0f\", $SIZE_DROP_THRESHOLD * 100}")
            if [ "$SKIP_SIZE_CHECK" != "true" ] && [ "${FORK_SIZE:-0}" -ge 50 ] && \
               [ "$(awk "BEGIN {print ($SIZE_DROP_THRESHOLD > 0 && $UPSTREAM_SIZE <= 0) ? 1 : 0}")" = "1" ]; then
              echo "::error::🛑 危险: 上游仓库为空或源码不可用 (fork=${FORK_SIZE}KB → upstream=${UPSTREAM_SIZE}KB,阈值 ${THRESHOLD_PCT}%)"
              log_event "$FORK_REPO" "size_check" "skip" reason="上游仓库为空或源码不可用" fork_kb="$FORK_SIZE" upstream_kb="$UPSTREAM_SIZE" ratio_pct="0.0" threshold_pct="$THRESHOLD_PCT"
              protect_and_skip_fork "上游仓库为空或源码不可用,已保护备份并跳过同步" "疑似上游删库/清空源码/只保留空历史"
              return 0
            fi
            if [ "$SKIP_SIZE_CHECK" != "true" ] && [ "${FORK_SIZE:-0}" -ge 50 ] && [ "${UPSTREAM_SIZE:-0}" -gt 0 ] && \
               [ "$(awk "BEGIN {print ($UPSTREAM_SIZE < $FORK_SIZE * $SIZE_DROP_THRESHOLD) ? 1 : 0}")" = "1" ]; then
              local RATIO
              RATIO=$(awk "BEGIN {printf \"%.1f\", $UPSTREAM_SIZE * 100 / $FORK_SIZE}")
              echo "::error::🛑 危险: 上游体积暴减 (fork=${FORK_SIZE}KB → upstream=${UPSTREAM_SIZE}KB, 上游只剩 fork 的 ${RATIO}%,阈值 ${THRESHOLD_PCT}%)"
              log_event "$FORK_REPO" "size_check" "skip" reason="上游体积暴减" fork_kb="$FORK_SIZE" upstream_kb="$UPSTREAM_SIZE" ratio_pct="$RATIO" threshold_pct="$THRESHOLD_PCT"
              protect_and_skip_fork "上游体积暴减,已保护备份并跳过同步" "疑似上游删除了源码,只留下 README/说明文件"
              return 0
            fi
            if [ "$SKIP_SIZE_CHECK" = "true" ]; then
              echo "📏 体积检查跳过 (豁免): fork=${FORK_SIZE}KB, upstream=${UPSTREAM_SIZE}KB"
            else
              echo "📏 体积检查通过: fork=${FORK_SIZE}KB, upstream=${UPSTREAM_SIZE}KB (阈值 ${THRESHOLD_PCT}%)"
              log_event "$FORK_REPO" "size_check" "pass" fork_kb="$FORK_SIZE" upstream_kb="$UPSTREAM_SIZE" threshold_pct="$THRESHOLD_PCT"
            fi

            # ----- 阶段 2: 备份当前 fork 默认分支 -----
            local FORK_DEFAULT_SHA
            FORK_DEFAULT_SHA=$(gh_api_with_retry "repos/$FORK_OWNER/$FORK_REPO/git/ref/heads/$UPSTREAM_DEFAULT" \
                               --jq '.object.sha' 2>/dev/null || echo "")
            if [ -n "$FORK_DEFAULT_SHA" ]; then
              local BACKUP_TAG
              BACKUP_TAG="backup/$(date +%Y%m%d-%H%M%S)-${FORK_DEFAULT_SHA:0:7}"
              if gh_api_write -X POST "repos/$FORK_OWNER/$FORK_REPO/git/refs" \
                   -f ref="refs/tags/$BACKUP_TAG" \
                   -f sha="$FORK_DEFAULT_SHA" >/dev/null 2>&1; then
                echo "💾 备份: $BACKUP_TAG → ${FORK_DEFAULT_SHA:0:7}"
                log_event "$FORK_REPO" "backup_tag" "ok" tag="$BACKUP_TAG" sha="${FORK_DEFAULT_SHA:0:7}"
              fi
            fi

            # ----- 阶段 3: 遍历 upstream 分支,逐个同步 -----
            local UPSTREAM_BRANCH_LIST UPSTREAM_BRANCH_ERR UPSTREAM_BRANCH_API
            UPSTREAM_BRANCH_API="repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/branches?per_page=100"
            if ! gh_api_capture UPSTREAM_BRANCH_LIST UPSTREAM_BRANCH_ERR --paginate "$UPSTREAM_BRANCH_API" \
                 --jq '.[] | .name'; then
              UPSTREAM_BRANCH_LIST=""
            fi
            if [ -z "$UPSTREAM_BRANCH_LIST" ]; then
              echo "    ❌ 拿不到 upstream 分支列表"
              record_failure "__branches__" "拿不到 upstream 分支列表" "branches" "$UPSTREAM_BRANCH_API" "$UPSTREAM_BRANCH_ERR" "auto"
              write_fork_summary "fail"
              return 0
            fi

            # GitHub branches API is paginated. Process the default branch first so
            # a large upstream cannot starve main behind later pages.
            SORTED_BRANCH_LIST=$(printf '%s\n' "$UPSTREAM_BRANCH_LIST" | awk -v default_branch="$UPSTREAM_DEFAULT" '
              $0 == "" { next }
              $0 == default_branch { has_default = 1; next }
              !seen[$0]++ { branches[++n] = $0 }
              END {
                if (default_branch != "" && has_default) print default_branch
                for (i = 1; i <= n; i++) print branches[i]
              }
            ') || {
              echo "    ❌ upstream 分支排序失败"
              record_failure "__branches__" "upstream 分支排序失败" "branches" "$UPSTREAM_BRANCH_API" "" "auto"
              write_fork_summary "fail"
              return 0
            }
            UPSTREAM_BRANCH_LIST="$SORTED_BRANCH_LIST"
            if [ -z "$UPSTREAM_BRANCH_LIST" ]; then
              echo "    ❌ upstream 分支排序后为空"
              record_failure "__branches__" "upstream 分支排序后为空" "branches" "$UPSTREAM_BRANCH_API" "" "auto"
              write_fork_summary "fail"
              return 0
            fi

            local TOTAL_BRANCH_COUNT EFFECTIVE_BRANCH_LIMIT BRANCH_LIMIT_SOURCE FULL_BRANCH_SYNC
            local OVERRIDE_LIMIT SELECTED_BRANCH_LIST SELECTED_COUNT SKIPPED_BY_PATTERN SKIPPED_BY_LIMIT
            TOTAL_BRANCH_COUNT=$(printf '%s\n' "$UPSTREAM_BRANCH_LIST" | grep -c . || true)
            EFFECTIVE_BRANCH_LIMIT="$MAX_BRANCHES_PER_FORK"
            BRANCH_LIMIT_SOURCE="default"
            FULL_BRANCH_SYNC=false

            if repo_in_csv "$FULL_BRANCH_SYNC_REPOS"; then
              FULL_BRANCH_SYNC=true
              EFFECTIVE_BRANCH_LIMIT=0
              BRANCH_LIMIT_SOURCE="full_branch_sync_repos"
            else
              OVERRIDE_LIMIT=$(branch_limit_override_for_repo "$BRANCH_LIMIT_OVERRIDES" || true)
              if [ -n "$OVERRIDE_LIMIT" ]; then
                EFFECTIVE_BRANCH_LIMIT="$OVERRIDE_LIMIT"
                BRANCH_LIMIT_SOURCE="branch_limit_overrides"
              else
                OVERRIDE_LIMIT=$(branch_limit_group_for_repo "$BRANCH_LIMIT_GROUPS" || true)
                if [ -n "$OVERRIDE_LIMIT" ]; then
                  EFFECTIVE_BRANCH_LIMIT="$OVERRIDE_LIMIT"
                  BRANCH_LIMIT_SOURCE="branch_limit_groups"
                fi
              fi
            fi

            SELECTED_BRANCH_LIST=""
            SELECTED_COUNT=0
            SKIPPED_BY_PATTERN=0
            SKIPPED_BY_LIMIT=0
            while IFS= read -r branch; do
              [ -z "$branch" ] && continue
              if [ "$FULL_BRANCH_SYNC" != "true" ] && [ "$branch" != "$UPSTREAM_DEFAULT" ] && \
                 branch_matches_pattern "$branch" "$SKIP_BRANCH_PATTERNS"; then
                SKIPPED_BY_PATTERN=$((SKIPPED_BY_PATTERN + 1))
                continue
              fi
              if [ "$FULL_BRANCH_SYNC" != "true" ] && [ "$EFFECTIVE_BRANCH_LIMIT" -gt 0 ] && \
                 [ "$SELECTED_COUNT" -ge "$EFFECTIVE_BRANCH_LIMIT" ]; then
                SKIPPED_BY_LIMIT=$((SKIPPED_BY_LIMIT + 1))
                continue
              fi
              SELECTED_BRANCH_LIST="${SELECTED_BRANCH_LIST}${branch}"$'\n'
              SELECTED_COUNT=$((SELECTED_COUNT + 1))
            done <<< "$UPSTREAM_BRANCH_LIST"

            UPSTREAM_BRANCH_LIST=$(printf '%s' "$SELECTED_BRANCH_LIST")
            if [ -z "$UPSTREAM_BRANCH_LIST" ]; then
              echo "    ❌ upstream 分支筛选后为空"
              record_failure "__branches__" "upstream 分支筛选后为空" "branches" "$UPSTREAM_BRANCH_API" "" "auto"
              write_fork_summary "fail"
              return 0
            fi

            echo "🌿 分支计划: upstream=$TOTAL_BRANCH_COUNT, selected=$SELECTED_COUNT, limit=$EFFECTIVE_BRANCH_LIMIT, source=$BRANCH_LIMIT_SOURCE, pattern_skip=$SKIPPED_BY_PATTERN, limit_skip=$SKIPPED_BY_LIMIT"
            if [ "$SKIPPED_BY_LIMIT" -gt 0 ]; then
              echo "  ⏭️  $SKIPPED_BY_LIMIT 个 upstream 分支因超过上限暂不处理"
            fi
            if [ "$SKIPPED_BY_PATTERN" -gt 0 ]; then
              echo "  ⏭️  $SKIPPED_BY_PATTERN 个 upstream 分支匹配 skip_branch_patterns 暂不处理"
            fi
            log_event "$FORK_REPO" "branch_plan" "ok" \
              total_branches="$TOTAL_BRANCH_COUNT" selected_branches="$SELECTED_COUNT" \
              branch_limit="$EFFECTIVE_BRANCH_LIMIT" branch_limit_source="$BRANCH_LIMIT_SOURCE" \
              skipped_by_pattern="$SKIPPED_BY_PATTERN" skipped_by_limit="$SKIPPED_BY_LIMIT"

            while IFS= read -r branch; do
              [ -z "$branch" ] && continue
              echo "  ━━━ $branch ━━━"

              local UPSTREAM_SHA FORK_SHA UPSTREAM_SHA_ERR UPSTREAM_SHA_API
              UPSTREAM_SHA_API="repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/git/ref/heads/$branch"
              if ! gh_api_capture UPSTREAM_SHA UPSTREAM_SHA_ERR "$UPSTREAM_SHA_API" \
                   --jq '.object.sha'; then
                UPSTREAM_SHA=""
              fi
              if [ -z "$UPSTREAM_SHA" ]; then
                echo "    ❌ 拿不到 upstream SHA"
                record_failure "$branch" "拿不到 upstream SHA" "upstream_sha" "$UPSTREAM_SHA_API" "$UPSTREAM_SHA_ERR" "auto"
                continue
              fi

              local FORK_SHA_ERR FORK_SHA_API
              FORK_SHA_API="repos/$FORK_OWNER/$FORK_REPO/git/ref/heads/$branch"
              if ! gh_api_capture FORK_SHA FORK_SHA_ERR "$FORK_SHA_API" \
                   --jq '.object.sha'; then
                FORK_SHA=""
              fi

              if [ -z "$FORK_SHA" ]; then
                local CREATE_REF_OUT CREATE_REF_ERR CREATE_REF_API
                CREATE_REF_API="repos/$FORK_OWNER/$FORK_REPO/git/refs"
                if gh_api_write_capture CREATE_REF_OUT CREATE_REF_ERR -X POST "$CREATE_REF_API" \
                     -f ref="refs/heads/$branch" \
                     -f sha="$UPSTREAM_SHA" >/dev/null 2>&1; then
                  echo "    🆕 新建 → ${UPSTREAM_SHA:0:7}"
                  NEW+=("$branch")
                  SYNCED+=("$branch")
                  log_event "$FORK_REPO" "sync_branch" "new" branch="$branch" upstream_sha="${UPSTREAM_SHA:0:7}"
                else
                  echo "    ❌ 新建失败"
                  record_failure "$branch" "新建失败" "create_ref" "$CREATE_REF_API" "$CREATE_REF_ERR" "auto"
                fi
                continue
              fi

              local COMPARE_JSON STATUS AHEAD BEHIND COMPARE_ERR COMPARE_API
              COMPARE_API="repos/$FORK_OWNER/$FORK_REPO/compare/${UPSTREAM_OWNER}:${UPSTREAM_REPO}:${branch}...${branch}"
              if ! gh_api_capture COMPARE_JSON COMPARE_ERR "$COMPARE_API" \
                   --jq '{status: .status, ahead: .ahead_by, behind: .behind_by}'; then
                COMPARE_JSON='{"status":"error"}'
              fi
              STATUS=$(echo "$COMPARE_JSON" | jq -r '.status // "error"')
              AHEAD=$(echo "$COMPARE_JSON" | jq -r '.ahead // 0')
              BEHIND=$(echo "$COMPARE_JSON" | jq -r '.behind // 0')

              # upstream 没有新增时,纯 ahead 是 fork 本地独有提交,无需备份/同步。
              if { [ "$STATUS" = "ahead" ] || [ "$STATUS" = "diverged" ]; } && \
                 [ "$AHEAD" -gt 0 ] && [ "${BEHIND:-0}" -eq 0 ]; then
                echo "    ⏭️ 本地超前 $AHEAD commit,上游无新增,无需备份/同步"
                SKIPPED+=("$branch")
                log_event "$FORK_REPO" "sync_branch" "skip" branch="$branch" ahead="$AHEAD" behind="$BEHIND" reason="上游无新增"
                continue
              fi

              # 3.4.0 本地修改自动备份
              # 只在 upstream 有新增且 fork 有本地 commit 时备份;已有相同本地 patch 备份则跳过。
              if { [ "$STATUS" = "ahead" ] || [ "$STATUS" = "diverged" ]; } && \
                 [ "$AHEAD" -gt 0 ] && [ "${BEHIND:-0}" -gt 0 ] && [ -n "$FORK_SHA" ]; then
                local BACKUP_BRANCH LATEST_BACKUP SHOULD_CREATE_BACKUP BACKUP_READY BACKUP_COMPARE_RC
                SHOULD_CREATE_BACKUP=true
                BACKUP_READY=false
                LATEST_BACKUP=$(latest_local_backup_branch "$branch")

                if [ -n "$LATEST_BACKUP" ]; then
                  if local_backup_matches_current_changes "$branch" "$LATEST_BACKUP"; then
                    echo "    📦 已有相同本地修改备份: $LATEST_BACKUP,跳过新备份"
                    log_event "$FORK_REPO" "local_backup" "skip" branch="$branch" backup_branch="$LATEST_BACKUP" ahead="$AHEAD" behind="$BEHIND" reason="已有相同本地改动备份"
                    SHOULD_CREATE_BACKUP=false
                    BACKUP_READY=true
                  else
                    BACKUP_COMPARE_RC=$?
                    if [ "$BACKUP_COMPARE_RC" -eq 1 ]; then
                      echo "    📦 本地修改不同于最近备份: $LATEST_BACKUP,创建新备份"
                    else
                      echo "    ⚠️ 无法比较最近备份: $LATEST_BACKUP,保守创建新备份"
                      log_event "$FORK_REPO" "local_backup" "warn" branch="$branch" backup_branch="$LATEST_BACKUP" ahead="$AHEAD" behind="$BEHIND" reason="备份比较失败"
                    fi
                  fi
                fi

                if [ "$SHOULD_CREATE_BACKUP" = "true" ]; then
                  local BACKUP_REF_OUT BACKUP_REF_ERR BACKUP_REF_API
                  BACKUP_BRANCH="local-backup/${branch}-$(date +%Y%m%d-%H%M%S)-${FORK_SHA:0:7}"
                  BACKUP_REF_API="repos/$FORK_OWNER/$FORK_REPO/git/refs"
                  if gh_api_write_capture BACKUP_REF_OUT BACKUP_REF_ERR -X POST "$BACKUP_REF_API" \
                       -f ref="refs/heads/$BACKUP_BRANCH" \
                       -f sha="$FORK_SHA" >/dev/null 2>&1; then
                    echo "    📦 本地修改备份: $BACKUP_BRANCH (含 $AHEAD 个 commit)"
                    LOCAL_BACKED_UP+=("$branch:$BACKUP_BRANCH")
                    BACKUP_READY=true
                    log_event "$FORK_REPO" "local_backup" "ok" branch="$branch" backup_branch="$BACKUP_BRANCH" ahead="$AHEAD" behind="$BEHIND"
                  else
                    echo "    🛑 备份分支创建失败,跳过该分支同步以避免丢失本地修改"
                    log_event "$FORK_REPO" "local_backup" "fail" branch="$branch" backup_branch="$BACKUP_BRANCH" ahead="$AHEAD" behind="$BEHIND" reason="备份分支创建失败" api_message="$(api_error_message "$BACKUP_REF_ERR")" api_status="$(api_error_field "$BACKUP_REF_ERR" "status")"
                  fi
                fi

                if [ "$BACKUP_READY" != "true" ]; then
                  record_failure "$branch" "本地修改备份未完成" "backup_ref" "${BACKUP_REF_API:-}" "${BACKUP_REF_ERR:-}" "auto"
                  continue
                fi
              fi

              case "$STATUS" in
                identical)
                  echo "    = 已同步 (${UPSTREAM_SHA:0:7})"
                  log_event "$FORK_REPO" "sync_branch" "identical" branch="$branch" upstream_sha="${UPSTREAM_SHA:0:7}"
                  ;;
                behind)
                  if [ "$SYNC_MODE" = "pr" ]; then
                    # PR 模式: 建 sync 分支 + 开 PR,让用户审
                    local PR_BRANCH PR_NUM PR_REF_OUT PR_REF_ERR PR_REF_API
                    PR_BRANCH="sync-upstream/${branch}-$(date +%Y%m%d-%H%M%S)"
                    PR_REF_API="repos/$FORK_OWNER/$FORK_REPO/git/refs"
                    if gh_api_write_capture PR_REF_OUT PR_REF_ERR -X POST "$PR_REF_API" \
                         -f ref="refs/heads/$PR_BRANCH" \
                         -f sha="$UPSTREAM_SHA" >/dev/null 2>&1; then
                      local PR_JSON
                      PR_JSON=$(gh_api_write -X POST "repos/$FORK_OWNER/$FORK_REPO/pulls" \
                                -f title="[Sync] $branch ← upstream (落后 $BEHIND)" \
                                -f head="$PR_BRANCH" \
                                -f base="$branch" \
                                -f body="自动从 upstream 同步,$BEHIND 个 commit 待 review" 2>/dev/null)
                      PR_NUM=$(echo "$PR_JSON" | jq -r '.number // empty' 2>/dev/null)
                      echo "    🔀 落后 $BEHIND → 开 PR #$PR_NUM ($PR_BRANCH → $branch)"
                      NEW+=("$branch:$PR_BRANCH")
                      SYNCED+=("$branch")
                      log_event "$FORK_REPO" "sync_branch" "ok" branch="$branch" mode="pr" behind="$BEHIND" pr="$PR_NUM"
                    else
                      echo "    ❌ PR 模式: sync 分支创建失败"
                      record_failure "$branch" "sync 分支创建失败" "create_ref" "$PR_REF_API" "$PR_REF_ERR" "pr"
                    fi
                  else
                    # auto 模式: 直接 merge-upstream,失败兜底 PATCH
                    local MERGE_OUT MERGE_ERR MERGE_API PATCH_OUT PATCH_ERR PATCH_API
                    MERGE_API="repos/$FORK_OWNER/$FORK_REPO/merge-upstream"
                    if gh_api_write_capture MERGE_OUT MERGE_ERR -X POST "$MERGE_API" \
                         -f branch="$branch" >/dev/null 2>&1; then
                      echo "    ⏪ 落后 $BEHIND → merge-upstream 快进"
                      SYNCED+=("$branch")
                      log_event "$FORK_REPO" "sync_branch" "ok" branch="$branch" mode="merge" behind="$BEHIND"
                    else
                      PATCH_API="repos/$FORK_OWNER/$FORK_REPO/git/refs/heads/$branch"
                      if gh_api_write_capture PATCH_OUT PATCH_ERR -X PATCH "$PATCH_API" \
                           -f sha="$UPSTREAM_SHA" -F force=true >/dev/null 2>&1; then
                        echo "    ⏪ 落后 $BEHIND → PATCH 兜底"
                        SYNCED+=("$branch")
                        log_event "$FORK_REPO" "sync_branch" "ok" branch="$branch" mode="patch" behind="$BEHIND"
                      else
                        echo "    ❌ merge + PATCH 都失败"
                        record_failure "$branch" "merge-upstream 和 PATCH 兜底都失败" "update_ref" "$PATCH_API" "$PATCH_ERR" "auto"
                        log_event "$FORK_REPO" "sync_branch" "fail" branch="$branch" mode="auto" reason="merge-upstream 原始错误" context="merge_upstream" api_path="$MERGE_API" api_status="$(api_error_field "$MERGE_ERR" "status")" api_message="$(api_error_message "$MERGE_ERR")" hint="$(api_error_hint "merge_upstream" "$(api_error_field "$MERGE_ERR" "status")" "$(api_error_message "$MERGE_ERR")")"
                      fi
                    fi
                  fi
                  ;;
                ahead|diverged)
                  if [ "$DISCARD_LOCAL_CHANGES" = "force" ]; then
                    # 等价于 GitHub 网页 Sync fork 里的 Discard commits: ref 必须指向 upstream SHA。
                    local VERIFY_SHA DISCARD_OUT DISCARD_ERR DISCARD_API VERIFY_ERR VERIFY_API
                    DISCARD_API="repos/$FORK_OWNER/$FORK_REPO/git/refs/heads/$branch"
                    if gh_api_write_capture DISCARD_OUT DISCARD_ERR -X PATCH "$DISCARD_API" \
                         -f sha="$UPSTREAM_SHA" -F force=true >/dev/null; then
                      VERIFY_API="repos/$FORK_OWNER/$FORK_REPO/git/ref/heads/$branch"
                      if ! gh_api_capture VERIFY_SHA VERIFY_ERR "$VERIFY_API" \
                           --jq '.object.sha'; then
                        VERIFY_SHA=""
                      fi
                      if [ "$VERIFY_SHA" = "$UPSTREAM_SHA" ]; then
                        echo "    ⏩ Discard commits: 丢弃 $AHEAD + 同步 $BEHIND → ${UPSTREAM_SHA:0:7}"
                        SYNCED+=("$branch")
                        log_event "$FORK_REPO" "sync_branch" "ok" branch="$branch" mode="discard_commits" ahead="$AHEAD" behind="$BEHIND" upstream_sha="${UPSTREAM_SHA:0:7}"
                      else
                        echo "    ❌ Discard commits 校验失败: fork=${VERIFY_SHA:0:7}, upstream=${UPSTREAM_SHA:0:7}"
                        if [ -n "$VERIFY_ERR" ]; then
                          record_failure "$branch" "Discard commits 后校验失败" "verify_ref" "$VERIFY_API" "$VERIFY_ERR" "discard_commits"
                        else
                          record_failure "$branch" "同步后 SHA 不一致: fork=${VERIFY_SHA:0:7}, upstream=${UPSTREAM_SHA:0:7}" "verify_ref" "$VERIFY_API" "" "discard_commits"
                        fi
                      fi
                    else
                      echo "    ❌ Discard commits 失败"
                      record_failure "$branch" "PATCH force update 失败" "discard" "$DISCARD_API" "$DISCARD_ERR" "discard_commits"
                    fi
                  else
                    # keep 模式: 去重备份 + 用 merge-upstream 合并上游更新，保留本地改动
                    local KEEP_MERGE_OUT KEEP_MERGE_ERR KEEP_MERGE_API
                    KEEP_MERGE_API="repos/$FORK_OWNER/$FORK_REPO/merge-upstream"
                    if gh_api_write_capture KEEP_MERGE_OUT KEEP_MERGE_ERR -X POST "$KEEP_MERGE_API" \
                         -f branch="$branch" >/dev/null 2>&1; then
                      echo "    🔀 保留本地 $AHEAD commit，merge upstream $BEHIND commit → ${UPSTREAM_SHA:0:7}"
                      SYNCED+=("$branch")
                      log_event "$FORK_REPO" "sync_branch" "ok" branch="$branch" mode="keep" ahead="$AHEAD" behind="$BEHIND"
                    else
                      echo "    ❌ merge-upstream 失败"
                      record_failure "$branch" "merge-upstream 失败" "merge_keep" "$KEEP_MERGE_API" "$KEEP_MERGE_ERR" "keep"
                    fi
                  fi
                  ;;
                *)
                  echo "    ⚠️ compare 异常 (status=$STATUS)"
                  if [ "$DISCARD_LOCAL_CHANGES" = "force" ] && \
                     [ "$(api_error_field "$COMPARE_ERR" "status")" = "404" ] && \
                     printf '%s' "$(api_error_message "$COMPARE_ERR")" | grep -Fq 'No common ancestor'; then
                    echo "    ⚠️ 分支无共同祖先,按 Discard commits 处理"
                    local ORPHAN_BACKUP_BRANCH ORPHAN_BACKUP_OUT ORPHAN_BACKUP_ERR ORPHAN_BACKUP_API
                    local ORPHAN_DISCARD_OUT ORPHAN_DISCARD_ERR ORPHAN_DISCARD_API ORPHAN_VERIFY_SHA ORPHAN_VERIFY_ERR ORPHAN_VERIFY_API
                    ORPHAN_BACKUP_BRANCH="local-backup/${branch}-$(date +%Y%m%d-%H%M%S)-${FORK_SHA:0:7}"
                    ORPHAN_BACKUP_API="repos/$FORK_OWNER/$FORK_REPO/git/refs"
                    if gh_api_write_capture ORPHAN_BACKUP_OUT ORPHAN_BACKUP_ERR -X POST "$ORPHAN_BACKUP_API" \
                         -f ref="refs/heads/$ORPHAN_BACKUP_BRANCH" \
                         -f sha="$FORK_SHA" >/dev/null 2>&1; then
                      echo "    📦 无共同祖先备份: $ORPHAN_BACKUP_BRANCH"
                      LOCAL_BACKED_UP+=("$branch:$ORPHAN_BACKUP_BRANCH")
                      log_event "$FORK_REPO" "local_backup" "ok" branch="$branch" backup_branch="$ORPHAN_BACKUP_BRANCH" reason="无共同祖先备份"

                      ORPHAN_DISCARD_API="repos/$FORK_OWNER/$FORK_REPO/git/refs/heads/$branch"
                      if gh_api_write_capture ORPHAN_DISCARD_OUT ORPHAN_DISCARD_ERR -X PATCH "$ORPHAN_DISCARD_API" \
                           -f sha="$UPSTREAM_SHA" -F force=true >/dev/null; then
                        ORPHAN_VERIFY_API="repos/$FORK_OWNER/$FORK_REPO/git/ref/heads/$branch"
                        if ! gh_api_capture ORPHAN_VERIFY_SHA ORPHAN_VERIFY_ERR "$ORPHAN_VERIFY_API" \
                             --jq '.object.sha'; then
                          ORPHAN_VERIFY_SHA=""
                        fi
                        if [ "$ORPHAN_VERIFY_SHA" = "$UPSTREAM_SHA" ]; then
                          echo "    ⏩ Discard commits: 无共同祖先 → ${UPSTREAM_SHA:0:7}"
                          SYNCED+=("$branch")
                          log_event "$FORK_REPO" "sync_branch" "ok" branch="$branch" mode="discard_no_common_ancestor" upstream_sha="${UPSTREAM_SHA:0:7}" backup_branch="$ORPHAN_BACKUP_BRANCH"
                        else
                          echo "    ❌ Discard commits 校验失败: fork=${ORPHAN_VERIFY_SHA:0:7}, upstream=${UPSTREAM_SHA:0:7}"
                          if [ -n "$ORPHAN_VERIFY_ERR" ]; then
                            record_failure "$branch" "无共同祖先 Discard 后校验失败" "verify_ref" "$ORPHAN_VERIFY_API" "$ORPHAN_VERIFY_ERR" "discard_no_common_ancestor"
                          else
                            record_failure "$branch" "无共同祖先同步后 SHA 不一致: fork=${ORPHAN_VERIFY_SHA:0:7}, upstream=${UPSTREAM_SHA:0:7}" "verify_ref" "$ORPHAN_VERIFY_API" "" "discard_no_common_ancestor"
                          fi
                        fi
                      else
                        echo "    ❌ 无共同祖先 Discard commits 失败"
                        record_failure "$branch" "无共同祖先 PATCH force update 失败" "discard" "$ORPHAN_DISCARD_API" "$ORPHAN_DISCARD_ERR" "discard_no_common_ancestor"
                      fi
                    else
                      echo "    🛑 无共同祖先备份分支创建失败,跳过该分支同步"
                      log_event "$FORK_REPO" "local_backup" "fail" branch="$branch" backup_branch="$ORPHAN_BACKUP_BRANCH" reason="无共同祖先备份分支创建失败" api_message="$(api_error_message "$ORPHAN_BACKUP_ERR")" api_status="$(api_error_field "$ORPHAN_BACKUP_ERR" "status")"
                      record_failure "$branch" "无共同祖先备份未完成" "backup_ref" "$ORPHAN_BACKUP_API" "$ORPHAN_BACKUP_ERR" "discard_no_common_ancestor"
                    fi
                  else
                    record_failure "$branch" "compare 异常" "compare" "$COMPARE_API" "$COMPARE_ERR" "auto"
                  fi
                  ;;
              esac
            done <<< "$UPSTREAM_BRANCH_LIST"

            # ----- 阶段 4: 清理旧 backup tag -----
            local KEPT=20
            local TAGS
            TAGS=$(gh_api_with_retry "repos/$FORK_OWNER/$FORK_REPO/git/refs/tags" \
                   --jq '.[] | .ref' 2>/dev/null \
                   | sed 's|refs/tags/||' \
                   | grep '^backup/' || true)
            local TAG_COUNT
            if [ -n "$TAGS" ]; then
              TAG_COUNT=$(printf '%s\n' "$TAGS" | grep -c .)
            else
              TAG_COUNT=0
            fi
            if [ "$TAG_COUNT" -gt "$KEPT" ]; then
              echo "  🗑️ 清理旧 backup tag ($TAG_COUNT → 保留 $KEPT)"
              echo "$TAGS" | tail -n +$((KEPT+1)) | while read -r tag; do
                [ -z "$tag" ] && continue
                gh_api_write -X DELETE "repos/$FORK_OWNER/$FORK_REPO/git/refs/tags/$tag" \
                  >/dev/null 2>&1 && echo "    - $tag"
              done
            fi

            # ----- 阶段 5: 单 fork 汇总 -----
            write_fork_summary "ok"
          }
          export -f process_fork
          export MY_OWNER CONFIG_REPO SIZE_DROP_THRESHOLD SIZE_CHECK_EXEMPT LOG_DIR SYNC_MODE SKIP_LIST DISCARD_LOCAL_CHANGES
          export MAX_BRANCHES_PER_FORK SKIP_BRANCH_PATTERNS FULL_BRANCH_SYNC_REPOS BRANCH_LIMIT_GROUPS BRANCH_LIMIT_OVERRIDES

          # API 限流检查:剩余配额 = 0 时睡到 reset
          # 一次只查一次 (在 xargs 启动前),各 fork 不再重复查
          check_rate_limit() {
            local info
            info=$(gh_api_with_retry "rate_limit" \
              --jq '{remaining: .resources.core.remaining, reset: .resources.core.reset, limit: .resources.core.limit}' 2>/dev/null || echo '{}')
            local remaining reset limit now wait
            remaining=$(echo "$info" | jq -r '.remaining // 9999')
            reset=$(echo "$info" | jq -r '.reset // 0')
            limit=$(echo "$info" | jq -r '.limit // 5000')
            echo "📊 rate limit: $remaining/$limit"
            if [ "$remaining" -le 0 ] 2>/dev/null; then
              now=$(date +%s)
              wait=$((reset - now + 10))
              if [ $wait -gt 0 ] && [ $wait -lt 3700 ]; then
                local reset_human
                reset_human=$(date -d "@$reset" '+%H:%M:%S' 2>/dev/null || date -r "$reset" '+%H:%M:%S')
                echo "  ⏸️  限流,等待 ${wait}s (到 $reset_human UTC)"
                sleep "$wait"
                echo "  ✅ 等待完毕,继续"
              fi
            fi
          }
          check_rate_limit

          # 并发跑 (MAX_PARALLEL 个同时),用 base64 传递 JSON 避免 shell/xargs 吃掉引号
          echo "$FORKS" | jq -r '.[] | @base64' | xargs -r -P "$MAX_PARALLEL" -I {} bash -c 'process_fork "$1"' _ {}

          # 按原始 fork 顺序输出所有 log
          echo "$FORKS" | jq -r '.[].name' | while read -r name; do
            if [ -f "$LOG_DIR/$name.log" ]; then
              cat "$LOG_DIR/$name.log"
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ 全部 fork 处理完毕 (并发 $MAX_PARALLEL)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # 把结构化 events 输出到主 log (Item 11),方便不下载 artifact 也能看到
          # 同时生成 CSV 报告 (Item 12),用 actions/upload-artifact 上传留档
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📋 结构化事件日志 (events.jsonl)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
          if [ -f "$RUNNER_TEMP/events.jsonl" ] && [ -s "$RUNNER_TEMP/events.jsonl" ]; then
            cat "$RUNNER_TEMP/events.jsonl"
            echo ""
            EVENT_COUNT=$(wc -l < "$RUNNER_TEMP/events.jsonl" | tr -d ' ')
            echo "📊 共 $EVENT_COUNT 条事件"

            # 生成 CSV 报告 (Item 12)
            # 预定义所有 log_event 调用的 k=v 字段,缺则空
            CSV_KEYS="ts fork action result mode run_id upstream default_branch reason context hint api_status api_message api_path fork_kb upstream_kb ratio_pct threshold_pct tag sha upstream_sha branch behind ahead pr new synced failed skipped local_backup status backup_branch total_branches selected_branches branch_limit branch_limit_source skipped_by_pattern skipped_by_limit"
            # header
            echo "$CSV_KEYS" | tr ' ' '\n' | jq -R '.' | jq -rs '@csv' > "$RUNNER_TEMP/events.csv"
            # body
            jq -r --arg keys "$CSV_KEYS" '
              . as $event
              | ($keys | split(" ")) as $k
              | [ $k[] | $event[.] // "" ] | @csv
            ' "$RUNNER_TEMP/events.jsonl" >> "$RUNNER_TEMP/events.csv"
            CSV_LINES=$(($(wc -l < "$RUNNER_TEMP/events.csv") - 1))
            echo "📊 CSV 报告: $CSV_LINES 条记录 → $RUNNER_TEMP/events.csv"

            # 生成 per-fork 状态文件 (Item 14)
            # 给每个 fork 聚合:最后同步时间/SHA/结果/计数/连续失败次数
            # 跨 run 历史靠 artifact 留档(30 天),方便排查
            jq -s '
              group_by(.fork) | map({
                (.[0].fork): {
                  last_ts: (map(.ts) | max),
                  last_run_id: (.[0].run_id),
                  last_result: (
                    (map(select(.action == "fork_complete")) | last | .result) as $complete_result
                    | if $complete_result == "fail" then "fail"
                    elif $complete_result == "skip" then "skip"
                    elif (any(.result == "fail" or .result == "error")) then "fail"
                    elif $complete_result == "ok" then "complete"
                    elif $complete_result != null then $complete_result
                    else "partial"
                    end
                  ),
                  last_action: (map(.action) | unique | join(",")),
                  events: length
                }
              }) | add // {}
            ' "$RUNNER_TEMP/events.jsonl" > "$RUNNER_TEMP/sync-state.json"
            FORK_COUNT=$(jq 'keys | length' "$RUNNER_TEMP/sync-state.json")
            echo "📊 状态文件: $FORK_COUNT 个 fork → $RUNNER_TEMP/sync-state.json"
          else
            echo "(无事件,跳过 CSV 生成)"
          fi

          TOTAL_FAILED=$(jq -s '[.[].failed] | add // 0' "$RUNNER_TEMP/summary.jsonl" 2>/dev/null || echo 0)
          if [ "$TOTAL_FAILED" -gt 0 ]; then
            echo "::error::本次同步存在 $TOTAL_FAILED 个分支失败"
            exit 1
          fi

      # =====================================================================
      # Step 2.5: Drift 检测 (Item 15)
      # 读 workflow-state 分支上的 .drift-state.json(可能不存在)→ 合并本次结果 →
      # 连续 3 次 fail 的 fork 开 issue 告警 → 写回新 state
      # 跟 sync-config.yml 不同:.drift-state.json 是 workflow 自己管理的状态文件,
      # 但不再写回 main,避免污染配置仓库主分支
      # =====================================================================
      - name: Detect drift
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          DRIFT_FILE=".drift-state.json"
          STATE_BRANCH="workflow-state"
          DRIFT_THRESHOLD=3

          SYNC_STATE="$RUNNER_TEMP/sync-state.json"
          if [ ! -f "$SYNC_STATE" ] || [ ! -s "$SYNC_STATE" ]; then
            echo "⏭️  无 sync-state.json,跳过 drift 检测"
            exit 0
          fi

          # 读 workflow-state 分支上的旧 drift state (可能分支或文件都不存在)
          OLD_DRIFT_JSON=$(gh_api_with_retry "repos/$MY_OWNER/$REPO/contents/$DRIFT_FILE?ref=$STATE_BRANCH" 2>/dev/null || echo "")
          if [ -n "$OLD_DRIFT_JSON" ] && [ "$OLD_DRIFT_JSON" != "Not Found" ]; then
            OLD_B64=$(echo "$OLD_DRIFT_JSON" | jq -r '.content // ""')
            OLD_SHA=$(echo "$OLD_DRIFT_JSON" | jq -r '.sha // ""')
            if [ -n "$OLD_B64" ]; then
              OLD_STATE=$(echo "$OLD_B64" | base64 -d 2>/dev/null || echo "{}")
            else
              OLD_STATE="{}"
            fi
          else
            OLD_STATE="{}"
            OLD_SHA=""
            echo "📄 .drift-state.json 不存在,从空开始"
          fi

          # 合并:对每个 fork,fail→consecutive_failures+1,否则重置为 0
          NEW_STATE=$(jq -s --argjson old "$OLD_STATE" '
            {
              forks: (
                ($old.forks // {}) as $old_forks
                | .[0] as $current
                | $current | keys | map(
                    . as $fork
                    | $current[$fork].last_result as $result
                    | ($old_forks[$fork].consecutive_failures // 0) as $old_cf
                    | {
                        ($fork): {
                          last_result: $result,
                          last_ts: $current[$fork].last_ts,
                          consecutive_failures: (
                            if $result == "fail" then $old_cf + 1
                            else 0
                            end
                          ),
                          last_alert_ts: (if $old_forks[$fork].last_alert_ts == null then null else $old_forks[$fork].last_alert_ts end)
                        }
                      }
                  ) | add // {}
              ),
              updated_at: (now | todate)
            }
          ' "$SYNC_STATE")

          echo "📊 drift state 更新后:"
          echo "$NEW_STATE" | jq '.forks'

          # 找连续失败达到阈值的 fork
          ALERT_FORKS=$(echo "$NEW_STATE" | jq -r --argjson th "$DRIFT_THRESHOLD" \
            '.forks | to_entries | map(select(.value.consecutive_failures >= $th)) | .[].key')
          if [ -n "$ALERT_FORKS" ]; then
            ALERT_COUNT=$(printf '%s\n' "$ALERT_FORKS" | grep -c .)
          else
            ALERT_COUNT=0
          fi

          if [ "$ALERT_COUNT" -gt 0 ]; then
            echo "🚨 检测到 $ALERT_COUNT 个 fork 连续失败 ≥ $DRIFT_THRESHOLD 次: $ALERT_FORKS"
            DETAIL=$(echo "$NEW_STATE" | jq -r --argjson th "$DRIFT_THRESHOLD" \
              '.forks | to_entries[] | select(.value.consecutive_failures >= $th) | "- **\(.key)**: 连续失败 \(.value.consecutive_failures) 次 (最后: \(.value.last_ts))"')
            ISSUE_TITLE="🚨 Fork Drift Alert: 连续失败"
            printf -v ISSUE_BODY "以下 fork 连续失败 ≥ %s 次,可能 fork 或 upstream 出问题,请排查:\n\n%s\n\n- 排查方式:查看 Actions log 和 [Artifact](https://github.com/%s/%s/actions/runs/%s)\n- 解决后下次 run 成功会自动清除告警状态" \
              "$DRIFT_THRESHOLD" "$DETAIL" "$MY_OWNER" "$REPO" "$GITHUB_RUN_ID"

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[DRY-RUN] 会开 issue: $ISSUE_TITLE"
            else
              NEW_ISSUE=$(gh_api_with_retry -X POST "repos/$MY_OWNER/$REPO/issues" \
                -f title="$ISSUE_TITLE" \
                -f body="$ISSUE_BODY" \
                -f label="drift-alert" 2>/dev/null)
              NEW_NUM=$(echo "$NEW_ISSUE" | jq -r '.number // empty' 2>/dev/null)
              if [ -n "$NEW_NUM" ]; then
                echo "📝 开漂移告警 issue #$NEW_NUM"
                NEW_STATE=$(echo "$NEW_STATE" | jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  '.forks |= with_entries(
                    if .value.consecutive_failures >= '"$DRIFT_THRESHOLD"' then .value.last_alert_ts = $ts else . end
                  )')
              fi
            fi
          else
            echo "✅ 无 drift 告警"
          fi

          # 写回 .drift-state.json (用 API PUT)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "[DRY-RUN] 写回 $STATE_BRANCH/$DRIFT_FILE 跳过"
          else
            STATE_BRANCH_SHA=$(gh_api_with_retry "repos/$MY_OWNER/$REPO/git/ref/heads/$STATE_BRANCH" \
              --jq '.object.sha // ""' 2>/dev/null || echo "")
            if [ -z "$STATE_BRANCH_SHA" ]; then
              DEFAULT_BRANCH=$(gh_api_with_retry "repos/$MY_OWNER/$REPO" --jq '.default_branch // "main"' 2>/dev/null || echo "main")
              DEFAULT_SHA=$(gh_api_with_retry "repos/$MY_OWNER/$REPO/git/ref/heads/$DEFAULT_BRANCH" \
                --jq '.object.sha // ""' 2>/dev/null || echo "")
              if [ -n "$DEFAULT_SHA" ]; then
                gh_api_write -X POST "repos/$MY_OWNER/$REPO/git/refs" \
                  -f ref="refs/heads/$STATE_BRANCH" \
                  -f sha="$DEFAULT_SHA" >/dev/null 2>&1 && \
                  echo "🌿 已创建状态分支: $STATE_BRANCH ← $DEFAULT_BRANCH" || \
                  echo "::warning::状态分支 $STATE_BRANCH 创建失败,后续写回可能失败"
              fi
            fi

            B64_CONTENT=$(echo "$NEW_STATE" | base64 -w 0)
            PUT_ARGS=(-X PUT "repos/$MY_OWNER/$REPO/contents/$DRIFT_FILE" \
              -f message="chore: update drift state (run $GITHUB_RUN_ID)" \
              -f content="$B64_CONTENT" \
              -f branch="$STATE_BRANCH")
            if [ -n "$OLD_SHA" ]; then
              PUT_ARGS+=(-f sha="$OLD_SHA")
            fi
            gh_api_with_retry "${PUT_ARGS[@]}" >/dev/null 2>&1 && \
              echo "📝 $STATE_BRANCH/$DRIFT_FILE 已更新" || \
              echo "::warning::$STATE_BRANCH/$DRIFT_FILE 写回失败(权限或冲突)"
          fi

      # =====================================================================
      # Step 3: 汇总到 issue (跑完自动开/更新一个固定 issue 贴汇总)
      # =====================================================================
      - name: Post issue summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          # 找 Step 2 写的 summary.jsonl
          SUMMARY_FILE="$RUNNER_TEMP/summary.jsonl"

          if [ ! -f "$SUMMARY_FILE" ] || [ ! -s "$SUMMARY_FILE" ]; then
            echo "⚠️ 没找到 summary.jsonl ($SUMMARY_FILE),跳过 issue 通知"
            exit 0
          fi

          # 聚合统计
          SUMMARY_JSON=$(jq -s '.' "$SUMMARY_FILE")
          TOTAL=$(echo "$SUMMARY_JSON" | jq 'length')
          TOTAL_NEW=$(echo "$SUMMARY_JSON" | jq '[.[].new] | add // 0')
          TOTAL_SYNCED=$(echo "$SUMMARY_JSON" | jq '[.[].synced] | add // 0')
          TOTAL_FAILED=$(echo "$SUMMARY_JSON" | jq '[.[].failed] | add // 0')
          TOTAL_SKIPPED=$(echo "$SUMMARY_JSON" | jq '[.[].skipped] | add // 0')
          TOTAL_BACKUP=$(echo "$SUMMARY_JSON" | jq '[.[].local_backup] | add // 0')
          RUN_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 拼 issue body (markdown)
          # 一次性 printf 拼好,避开 $(...) 吞尾部 \n 和 YAML literal block 不支持多行字符串拼接
          ISSUE_TITLE="🤖 Fork Sync Report"
          HEADER=$(printf "## 同步汇总\n\n- **运行时间**: %s (UTC)\n- **同步 fork 数**: %s\n- 🆕 新建分支: **%s**\n- ✅ 已同步: **%s**\n- ❌ 失败: **%s**\n- ⏭️ 跳过: **%s**\n- 📦 本地修改备份: **%s**\n\n### 详情\n\n| Fork | Result | Reason | 🆕 | ✅ | ❌ | ⏭️ | 📦 |\n|---|---|---|---|---|---|---|---|\n" \
            "$RUN_TS" "$TOTAL" "$TOTAL_NEW" "$TOTAL_SYNCED" "$TOTAL_FAILED" "$TOTAL_SKIPPED" "$TOTAL_BACKUP")
          # 每 fork 一行 (jq -r 输出多行,直接拼到 header 后面)
          DETAIL_ROWS=$(echo "$SUMMARY_JSON" | jq -r '.[] | "| \(.name) | \(.result // "ok") | \(.reason // "") | \(.new) | \(.synced) | \(.failed) | \(.skipped) | \(.local_backup) |"')
          FAILURE_ROWS=$(echo "$SUMMARY_JSON" | jq -r '
            def clean:
              tostring
              | gsub("[\r\n|]"; " ")
              | if length > 240 then .[0:237] + "..." else . end;
            [ .[] as $fork
              | ($fork.failure_details // [])[]?
              | "| \($fork.name | clean) | \(.branch | clean) | \(.reason | clean) | \(.hint | clean) | HTTP \((.api_status // "") | clean): \((.api_message // "") | clean) | \(.api_path | clean) |"
            ] | if length == 0 then "| - | - | - | - | - | - |" else .[] end
          ')
          # 一次性合并 header + 表格行 + 失败详情
          printf -v ISSUE_BODY "%s%s\n\n### 失败详情\n\n| Fork | Branch | Reason | Meaning | GitHub | API |\n|---|---|---|---|---|---|\n%s" \
            "$HEADER" "$DETAIL_ROWS" "$FAILURE_ROWS"

          # 找已有 issue
          EXISTING=$(gh_api_with_retry "repos/$MY_OWNER/${{ github.event.repository.name }}/issues?state=all&labels=&per_page=100" \
                     --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" 2>/dev/null | head -1 || echo "")

          if [ -n "$EXISTING" ]; then
            # 已有 → 更新
            gh_api_write -X PATCH "repos/$MY_OWNER/${{ github.event.repository.name }}/issues/$EXISTING" \
              -f title="$ISSUE_TITLE" \
              -f body="$ISSUE_BODY" >/dev/null
            echo "📝 更新 issue #$EXISTING"
          else
            # 没有 → 新建
            NEW_ISSUE=$(gh_api_write -X POST "repos/$MY_OWNER/${{ github.event.repository.name }}/issues" \
                        -f title="$ISSUE_TITLE" \
                        -f body="$ISSUE_BODY" 2>/dev/null)
            NEW_NUM=$(echo "$NEW_ISSUE" | jq -r '.number // empty')
            echo "📝 新建 issue #$NEW_NUM"
          fi

      # =====================================================================
      # Step 4: 发送 webhook 通知 (Slack / 钉钉 / 通用)
      # 推荐用 secrets.WEBHOOK_URL 存 URL,然后这里改成:
      #   WEBHOOK_URL: ${{ secrets.WEBHOOK_URL || inputs.webhook_url }}
      # webhook 失败不影响 workflow 整体结果
      # =====================================================================
      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ inputs.webhook_url }}
          WEBHOOK_TYPE: ${{ inputs.webhook_type || env.CONFIG_WEBHOOK_TYPE || 'slack' }}
        run: |
          set -e

          if [ -z "$WEBHOOK_URL" ]; then
            echo "⏭️  webhook_url 未配置,跳过通知"
            exit 0
          fi

          # 复用 Step 3 的 summary 数据
          SUMMARY_FILE="$RUNNER_TEMP/summary.jsonl"
          if [ ! -f "$SUMMARY_FILE" ] || [ ! -s "$SUMMARY_FILE" ]; then
            echo "⚠️ 没找到 summary.jsonl,跳过通知"
            exit 0
          fi

          SUMMARY_JSON=$(jq -s '.' "$SUMMARY_FILE")
          TOTAL=$(echo "$SUMMARY_JSON" | jq 'length')
          TOTAL_NEW=$(echo "$SUMMARY_JSON" | jq '[.[].new] | add // 0')
          TOTAL_SYNCED=$(echo "$SUMMARY_JSON" | jq '[.[].synced] | add // 0')
          TOTAL_FAILED=$(echo "$SUMMARY_JSON" | jq '[.[].failed] | add // 0')
          TOTAL_SKIPPED=$(echo "$SUMMARY_JSON" | jq '[.[].skipped] | add // 0')
          TOTAL_BACKUP=$(echo "$SUMMARY_JSON" | jq '[.[].local_backup] | add // 0')
          REPO_NAME="${{ github.event.repository.name }}"

          # 用 jq 构造 payload (自动 escape 换行/特殊字符)
          PAYLOAD=$(jq -n \
            --arg total "$TOTAL" --arg new "$TOTAL_NEW" --arg synced "$TOTAL_SYNCED" \
            --arg failed "$TOTAL_FAILED" --arg skipped "$TOTAL_SKIPPED" --arg backup "$TOTAL_BACKUP" \
            --arg repo "$REPO_NAME" --arg url "https://github.com/${{ github.repository_owner }}/$REPO_NAME/issues" \
            --arg type "$WEBHOOK_TYPE" '
            "🤖 *Fork Sync 完成* [\($repo)]\n同步: \($total) 个 fork\n🆕 新建: \($new) | ✅ 同步: \($synced) | ❌ 失败: \($failed)\n⏭️ 跳过: \($skipped) | 📦 本地备份: \($backup)\n查看 issue: \($url)" as $msg
            | if $type == "slack" then {text: $msg}
              elif $type == "dingtalk" then {msgtype: "markdown", markdown: {title: "Fork Sync", text: $msg}}
              else {message: $msg} end
          ')

          # POST 到 webhook (失败不中断 workflow)
          if curl -sf -X POST -H "Content-Type: application/json" \
                  -d "$PAYLOAD" "$WEBHOOK_URL" >/dev/null 2>&1; then
            echo "✅ webhook 通知已发送 ($WEBHOOK_TYPE)"
          else
            echo "::warning::webhook 发送失败 ($WEBHOOK_TYPE),但不影响 workflow"
          fi

      # =====================================================================
      # Step 5: 上传 artifact (Item 12: CSV + JSON 报告留档)
      # if: always() 让失败也留档,方便事后排查
      # 同一个 run 上传两个文件:events.jsonl (原始) + events.csv (易读)
      # 留 30 天 (默认 90,这里 30 够用 + 节省 artifact 存储)
      # =====================================================================
      - name: Upload sync artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-events
          path: |
            ${{ runner.temp }}/events.jsonl
            ${{ runner.temp }}/events.csv
            ${{ runner.temp }}/sync-state.json
          retention-days: 30
          if-no-files-found: warn
