# Fork Sync runtime configuration.

# Discovery-stage hard excludes. Use this only for repos that should disappear
# from reports entirely.
exclude_repos: ""

# Protection list: create/reuse local-backup/*, then skip all sync/Discard work.
protected_skip_repos: "gpt2api_432539"

# Release list: centralized backup first, then allow the original fork to align
# with its current GitHub upstream/source. Requires legacy_backup_repo.
legacy_backup_repos: "aBaiAutoplus_asz798838958"
backup_then_sync_repos: ""
legacy_backup_repo: "LinkStart413/fork-legacy-backups"
legacy_backup_branch_prefix: "legacy"

# Full-ref disaster backup: before sync/Discard, copy every branch and tag from
# each discovered fork into a private standalone repo under the backup account.
# Repository name defaults to the fork repository name.
mirror_backup_enabled: "true"
mirror_backup_owner: "LinkStart413"
mirror_backup_repos: "*"
mirror_backup_repo_prefix: ""
mirror_backup_repo_suffix: ""
mirror_backup_max_parallel: "1"
mirror_backup_snapshot_prefix: "snapshots"
mirror_backup_current_prefix: "current"
mirror_backup_tag_prefix: "backup"
mirror_backup_update_current: "true"

# Daily scheduled runs are disaster-backup only. Use manual inputs to disable
# this if you intentionally want to sync forks to upstream.
backup_only: "true"
