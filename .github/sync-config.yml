# Fork Sync runtime configuration.

# Discovery-stage hard excludes. Use this only for repos that should disappear
# from reports entirely.
exclude_repos: ""

# Protection list: create/reuse local-backup/*, then skip all sync/Discard work.
protected_skip_repos: "gpt2api_432539"

# Release list: centralized backup first, then allow the original fork to align
# with its current GitHub upstream/source. Requires legacy_backup_repo.
backup_then_sync_repos: ""
legacy_backup_repo: ""
legacy_backup_branch_prefix: "legacy"

# Disable GitHub Actions workflows in every managed fork before syncing.
# These forks are mirror targets; local work should happen on separate branches.
disable_fork_workflows: true
disable_fork_workflows_repos: "all"
disable_fork_workflows_keep_patterns: ""

# 已全量禁用 workflow 的 fork 在此天数内跳过重新探测;超过后强制重新探测。
# 新 fork 首次出现即强制探测;改上面 disable_fork_workflows_* 配置会强制全部重探测。
workflow_disable_ttl_days: 14

# 方案4 分批同步:每批处理的 fork 数;每批跑完检查剩余配额,
# 低于 sync_rate_safe_threshold 则提前结束,剩余 fork 下次 run 自动补上 (幂等)。
sync_batch_size: 15
sync_rate_safe_threshold: 300

# 三阶段模型:
#   full_check_interval_days: 每 N 天全量重检一次"可同步/不可同步"列表 (默认 14)
#   compare_batch_size:       阶段1 检测更新时每批检测的 fork 数,批间查配额 (默认 100)
#   retry_alert_threshold:    连续失败达到此次数后进入告警列表 (默认 3)
full_check_interval_days: 14
compare_batch_size: 100
retry_alert_threshold: 3
