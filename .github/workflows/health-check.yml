# =============================================================================
# GitHub Fork Sync - Health Check (独立 workflow)
# =============================================================================
# 用途: 定期检查 workflow 还能不能正常跑 (token/权限/API)
# 触发: cron (每天 1 次) + 手动
# 失败: 开 issue 告警
# =============================================================================

name: Health Check

on:
  # 每天 23:00 UTC (北京时间次日 07:00),跟 sync (00:00 UTC = 08:00 北京) 错开
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Run health checks
        id: checks
        env:
          MY_OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set +e
          RESULTS=()
          FAILED=0

          # 检查 1: gh auth
          echo "━━━ [1/3] gh auth ━━━"
          if gh auth status >/dev/null 2>&1; then
            echo "✅ gh auth OK"
            RESULTS+=("✅ auth: ok")
          else
            echo "❌ gh auth 失败"
            RESULTS+=("❌ auth: failed")
            FAILED=$((FAILED + 1))
          fi

          # 检查 2: API 可达 + rate limit
          echo ""
          echo "━━━ [2/3] API + rate limit ━━━"
          RATE_INFO=$(gh api rate_limit --jq '.resources.core | {remaining, limit, reset}' 2>/dev/null)
          if [ -n "$RATE_INFO" ] && [ "$RATE_INFO" != "null" ]; then
            REMAINING=$(echo "$RATE_INFO" | jq -r '.remaining // 0')
            LIMIT=$(echo "$RATE_INFO" | jq -r '.limit // 5000')
            RESET=$(echo "$RATE_INFO" | jq -r '.reset // 0')
            RESET_HUMAN=$(date -d "@$RESET" '+%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo "$RESET")
            echo "✅ API OK, 剩余 $REMAINING/$LIMIT (reset: $RESET_HUMAN)"
            RESULTS+=("✅ api: $REMAINING/$LIMIT")
            if [ "$REMAINING" -lt 100 ]; then
              echo "⚠️ 剩余配额 < 100,告警"
              RESULTS+=("⚠️ rate_limit_low: $REMAINING")
              FAILED=$((FAILED + 1))
            fi
          else
            echo "❌ API 不可达"
            RESULTS+=("❌ api: unreachable")
            FAILED=$((FAILED + 1))
          fi

          # 检查 3: 仓库读权限 (试着读 workflow 仓库 metadata)
          echo ""
          echo "━━━ [3/3] repo access ━━━"
          if gh api "repos/$MY_OWNER/$REPO" --jq '.full_name' >/dev/null 2>&1; then
            echo "✅ repo $MY_OWNER/$REPO 可读"
            RESULTS+=("✅ repo_access: ok")
          else
            echo "❌ 仓库读失败"
            RESULTS+=("❌ repo_access: failed")
            FAILED=$((FAILED + 1))
          fi

          # 输出汇总
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 health check: $FAILED 项失败"
          printf '%s\n' "${RESULTS[@]}"

          # 把结果写到 outputs (供下一步 issue 用)
          {
            echo "failed=$FAILED"
            echo "results<<EOF"
            printf '%s\n' "${RESULTS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report on failure
        if: steps.checks.outputs.failed > 0
        env:
          MY_OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          RESULTS: ${{ steps.checks.outputs.results }}
          FAILED: ${{ steps.checks.outputs.failed }}
        run: |
          set -e

          # 找已有的 health-check issue
          EXISTING=$(gh api "repos/$MY_OWNER/$REPO/issues?state=all&labels=health-check&per_page=10" \
            --jq '.[] | select(.title | startswith("🏥 Health Check")) | .number' 2>/dev/null | head -1 || echo "")

          RUN_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          printf -v BODY "## Health Check 失败\n\n- **运行时间**: %s (UTC)\n- **失败项数**: %s\n- **Run**: [%s](https://github.com/%s/%s/actions/runs/%s)\n\n### 详细结果\n\n\`\`\`\n%s\n\`\`\`\n\n请检查:\n- gh auth 状态 (token 是否过期)\n- API 限流情况\n- 仓库权限配置" \
            "$RUN_TS" "$FAILED" "$GITHUB_RUN_ID" "$MY_OWNER" "$REPO" "$GITHUB_RUN_ID" "$RESULTS"

          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$MY_OWNER/$REPO/issues/$EXISTING" \
              -f body="$BODY" >/dev/null
            echo "📝 更新 health-check issue #$EXISTING"
          else
            NEW_ISSUE=$(gh api -X POST "repos/$MY_OWNER/$REPO/issues" \
              -f title="🏥 Health Check Alert" \
              -f body="$BODY" \
              -f label="health-check" 2>/dev/null)
            NEW_NUM=$(echo "$NEW_ISSUE" | jq -r '.number // empty')
            echo "📝 新开 health-check issue #$NEW_NUM"
          fi

      - name: Fail on health check errors
        if: steps.checks.outputs.failed > 0
        run: |
          echo "::error::health check failed: ${{ steps.checks.outputs.failed }} item(s)"
          exit 1
