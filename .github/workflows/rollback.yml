# =============================================================================
# GitHub Fork Sync - 回滚按钮
# =============================================================================
# 用途: 把 fork 强推回某个 backup tag 指向的 SHA
# 触发: workflow_dispatch 手动 (带 fork / tag / confirm 三个 input)
# 安全: confirm 必须填 "yes" 才执行,避免误触
# 配合: Item 2 backup tag (backup/{时间戳}-{sha7}) / Item 2.4 local-backup branch
# =============================================================================

name: Rollback Fork

on:
  workflow_dispatch:
    inputs:
      fork:
        description: '要回滚的 fork 仓库名 (例: my-fork)'
        required: true
        type: string
      tag:
        description: '要回滚到的 backup tag (例: backup/20260604-013000-abc1234) — 留空则只列出 tags'
        required: false
        type: string
        default: ''
      confirm:
        description: '填 yes 确认执行 (强推会覆盖 fork 当前默认分支)'
        required: true
        type: string
        default: 'no'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      MY_OWNER: ${{ github.repository_owner }}
      FORK: ${{ inputs.fork }}
      TAG: ${{ inputs.tag }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      # =====================================================================
      # Step 1: 校验 + 列出 backup tags
      # =====================================================================
      - name: Validate input
        run: |
          set -e
          if [ -z "$FORK" ]; then
            echo "❌ fork 不能为空"
            exit 1
          fi
          echo "🔍 目标 fork: $MY_OWNER/$FORK"

      - name: List backup tags
        if: inputs.tag == ''
        run: |
          set -e
          echo "📋 $MY_OWNER/$FORK 最近的 backup tag:"
          gh api "repos/$MY_OWNER/$FORK/git/refs/tags" \
            --jq -r '.[] | .ref' \
            | sed 's|refs/tags/||' \
            | grep '^backup/' \
            | tail -20 || echo "(无 backup tag)"
          echo ""
          echo "💡 用法: 重新 trigger,tag 填上面列出的 tag 名"
          exit 0

      # =====================================================================
      # Step 2: 安全确认
      # =====================================================================
      - name: Confirm rollback
        if: inputs.tag != ''
        run: |
          set -e
          if [ "$CONFIRM" != "yes" ]; then
            echo "❌ confirm 必须填 'yes',当前: '$CONFIRM'"
            echo "💡 这是破坏性操作,需要明确确认"
            exit 1
          fi
          echo "✅ 用户已确认"

      # =====================================================================
      # Step 3: 拿 tag SHA + 推回 fork 默认分支
      # =====================================================================
      - name: Rollback fork
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -e

          # 1. 拿 tag 的 SHA
          TAG_SHA=$(gh api "repos/$MY_OWNER/$FORK/git/refs/tags/$TAG" --jq '.object.sha // empty' 2>/dev/null)
          if [ -z "$TAG_SHA" ]; then
            echo "❌ 拿不到 tag '$TAG' 的 SHA (tag 不存在?)"
            exit 1
          fi
          echo "📌 tag $TAG → ${TAG_SHA:0:7}"

          # 2. 拿 fork 默认分支
          DEFAULT_BRANCH=$(gh api "repos/$MY_OWNER/$FORK" --jq '.default_branch // "main"')
          echo "🌿 fork 默认分支: $DEFAULT_BRANCH"

          # 3. 拿当前 SHA (rollback 之前先存个新 backup tag)
          CURRENT_SHA=$(gh api "repos/$MY_OWNER/$FORK/git/ref/heads/$DEFAULT_BRANCH" --jq '.object.sha // empty' 2>/dev/null)
          if [ -n "$CURRENT_SHA" ]; then
            ROLLBACK_TAG="rollback/$(date +%Y%m%d-%H%M%S)-${CURRENT_SHA:0:7}"
            gh api -X POST "repos/$MY_OWNER/$FORK/git/refs" \
              -f ref="refs/tags/$ROLLBACK_TAG" \
              -f sha="$CURRENT_SHA" >/dev/null 2>&1 && \
              echo "💾 当前 SHA 已存 backup tag: $ROLLBACK_TAG → ${CURRENT_SHA:0:7}" || \
              echo "::warning::无法创建 rollback 前的 backup tag"
          fi

          # 4. 强推 tag SHA 到默认分支
          echo ""
          echo "⚠️  执行强推: $FORK/$DEFAULT_BRANCH → ${TAG_SHA:0:7} (from $TAG)"
          PATCH_RESULT=$(gh api -X PATCH "repos/$MY_OWNER/$FORK/git/refs/heads/$DEFAULT_BRANCH" \
            -f sha="$TAG_SHA" \
            -f force=true 2>&1)
          if echo "$PATCH_RESULT" | grep -q '"ref"'; then
            echo "✅ 回滚成功: $FORK/$DEFAULT_BRANCH 现在指向 ${TAG_SHA:0:7}"
            echo ""
            echo "📜 提交信息:"
            gh api "repos/$MY_OWNER/$FORK/git/commits/$TAG_SHA" --jq '"\(.[\"sha\"][0:7]) \(.message | split(\"\n\")[0])"'
          else
            echo "❌ 回滚失败: $PATCH_RESULT"
            exit 1
          fi
