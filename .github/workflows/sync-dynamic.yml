# =============================================================================
# GitHub Fork 自动同步工作流 - 动态发现版 (个人日常使用配置)
# =============================================================================
# 适用: 自动同步你名下指定 fork 到上游 (排除 claude 相关库)
# 风格: 动态发现 (auto-discover) + 名称模式排除
# 优势: 纯 API 调用,秒级完成,自动备份,智能判断 ahead/behind
#
# 跟 examples/sync-dynamic.yml 的区别:
#   - examples/sync-dynamic.yml: 通用模板,默认同步所有 fork
#   - 本文件 (sync-dynamic.yml): 作者日常使用,自动排除 claude 相关 fork
#
# 排除规则 (在 EXCLUDE_PATTERN 配置):
#   - 名称含 "claude" (大小写不敏感) 的 fork 会被跳过
#   - 想排除别的: 改 EXCLUDE_PATTERN,比如 "anthropic" / "openai" / "test"
#   - 不想排除: 改成 ""
#
# 一次性配置 (3 步):
#   1. 仓库 Settings → Actions → General → Workflow permissions
#      改成 "Read and write permissions" (重要!否则 PATCH 全部 403)
#   2. Actions 标签页点 "I understand my workflows, go ahead and enable them"
#   3. (可选) 手动触发一次看效果
#
# 详细文档见 ../docs/ 目录
# =============================================================================

name: Sync My Forks (Exclude Claude)

on:
  # 每天 UTC 02:00 (北京时间 10:00) 自动跑一次
  schedule:
    - cron: '0 2 * * *'
  # 允许 Actions 标签页手动触发
  workflow_dispatch:
    inputs:
      upstream_owner_filter:
        description: '只同步这个 owner 旗下的 fork (留空 = 所有)'
        required: false
        default: ''
      exclude_pattern:
        description: '排除仓库名含这个 pattern 的 fork (留空 = 用默认,匹配的是 fork 仓库名,不是 README 或代码)'
        required: false
        default: ''
      exclude_repos:
        description: '指定要排除的 fork 名,逗号分隔 (留空 = 不排除指定 fork)'
        required: false
        default: ''
      size_drop_threshold:
        description: '上游体积暴减告警阈值 (上游体积/fork 体积 < 此值触发,默认 0.10 = 10%)'
        required: false
        default: ''
      size_check_exempt:
        description: '豁免 size 检查的 fork 名,逗号分隔 (留空 = 不豁免任何 fork,适用于 1KB CLI 工具之类的小项目)'
        required: false
        default: ''
      max_parallel:
        description: '最大并发数 (默认 4,推荐 2-8,过高会触发 API 限流)'
        required: false
        default: ''
      dry_run:
        description: '干跑模式 (true = 只看不动,只打 log 不真写,默认 false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

# 显式声明需要写权限
permissions:
  contents: write
  issues: write

jobs:
  sync-all:
    runs-on: ubuntu-latest
    env:
      MY_OWNER: ${{ github.repository_owner }}
      # 日常使用配置: 排除 claude 相关 fork
      # 想排除别的关键词改这里 (大小写不敏感,匹配 fork 名称)
      # 留空 = 不排除任何 fork
      DEFAULT_EXCLUDE_PATTERN: 'claude'
      # 日常使用配置: 体积暴减告警阈值
      # 上游体积/fork 体积 < 此值时触发告警,跳过 fork
      # 0.10 = 上游只剩 fork 的 10% 触发 (推荐,敏感)
      # 0.30 = 上游只剩 fork 的 30% 触发 (宽松,大重构可能误判)
      # 0    = 关闭体积检查 (不推荐,会失去上游删源码防护)
      DEFAULT_SIZE_DROP_THRESHOLD: '0.10'
      # 日常使用配置: 最大并发 fork 数
      # 4 推荐值(够快又不触发限流),8 激进,1 串行
      DEFAULT_MAX_PARALLEL: '4'
      # 日常使用配置: 豁免 size 检查的 fork 名 (逗号分隔)
      # 适用于极小项目 (1KB CLI 工具等),被 size 检查误杀时加这里
      # 留空 = 不豁免任何 fork
      DEFAULT_SIZE_CHECK_EXEMPT: ''
    steps:
      # =====================================================================
      # Step 1: 发现 fork
      # =====================================================================
      - name: Discover forks
        id: discover
        env:
          FILTER: ${{ inputs.upstream_owner_filter }}
          # 手动输入优先,否则用默认排除 pattern
          EXCLUDE_PATTERN: ${{ inputs.exclude_pattern || env.DEFAULT_EXCLUDE_PATTERN }}
          # 手动指定要排除的 fork 名 (逗号分隔,精确匹配)
          EXCLUDE_REPOS: ${{ inputs.exclude_repos }}
          # 手动输入优先,否则用默认体积暴减阈值
          SIZE_DROP_THRESHOLD: ${{ inputs.size_drop_threshold || env.DEFAULT_SIZE_DROP_THRESHOLD }}
          # 手动输入优先,否则用默认 size 豁免名单
          SIZE_CHECK_EXEMPT: ${{ inputs.size_check_exempt || env.DEFAULT_SIZE_CHECK_EXEMPT }}
        run: |
          set -e

          FORKS=$(gh_api_with_retry 'user/repos?per_page=100&type=owner&sort=updated' \
                  --jq '[.[] | select(.fork == true and .parent != null) | {
                    name: .name,
                    parent_name: .parent.name,
                    parent_owner: .parent.owner.login,
                    parent_default_branch: .parent.default_branch
                  }]')

          # 正向过滤: 只保留指定 owner 的 fork
          if [ -n "$FILTER" ]; then
            FORKS=$(echo "$FORKS" | jq --arg f "$FILTER" '[.[] | select(.parent_owner == $f)]')
            echo "🔍 正向过滤: 只保留 parent_owner == $FILTER"
          fi

          # 反向过滤: 排除仓库名 (fork repo name) 含 EXCLUDE_PATTERN 的 fork (大小写不敏感)
          # 注意: 只匹配仓库名,不看 README/代码/描述
          if [ -n "$EXCLUDE_PATTERN" ]; then
            FORKS=$(echo "$FORKS" | jq --arg e "$EXCLUDE_PATTERN" \
              '[.[] | select((.name | ascii_downcase | contains($e | ascii_downcase)) | not)]')
            echo "🚫 反向过滤: 排除仓库名含 '$EXCLUDE_PATTERN' (大小写不敏感,只匹配 fork 仓库名)"
          fi

          # 反向过滤: 排除指定名称的 fork (精确匹配,逗号分隔)
          if [ -n "$EXCLUDE_REPOS" ]; then
            # 把 "a, b ,c" 转成 ["a","b","c"] 这样的 JSON 数组
            EXCLUDE_JSON=$(echo "$EXCLUDE_REPOS" | jq -R 'split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0))')
            EXCLUDE_COUNT=$(echo "$EXCLUDE_JSON" | jq length)
            FORKS=$(echo "$FORKS" | jq --argjson excl "$EXCLUDE_JSON" \
              '[.[] | select(.name as $n | $excl | index($n) == null)]')
            echo "🚫 指定排除: $EXCLUDE_COUNT 个 fork → $EXCLUDE_REPOS"
          fi

          COUNT=$(echo "$FORKS" | jq length)
          echo "forks<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FORKS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ 没找到任何符合条件的 fork"
            exit 0
          fi

          echo "🔍 发现 $COUNT 个 fork 待同步"
          echo "$FORKS" | jq -r '.[] | "  - \(.name) ← \(.parent_owner)/\(.parent_name)"'

      # =====================================================================
      # Step 2: 并发同步 fork (5 阶段执行流程,每 fork 一份 log)
      # =====================================================================
      - name: Sync each fork
        env:
          FORKS: ${{ steps.discover.outputs.forks }}
          MAX_PARALLEL: ${{ inputs.max_parallel || env.DEFAULT_MAX_PARALLEL }}
          SIZE_CHECK_EXEMPT: ${{ inputs.size_check_exempt || env.DEFAULT_SIZE_CHECK_EXEMPT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e

          # 每 fork 单独 log 文件,避免并发输出错乱
          LOG_DIR=$(mktemp -d)
          trap 'rm -rf "$LOG_DIR"' EXIT

          # 重试包装:失败时 1s/2s/4s 指数退避,最多 3 次
          # 适用于网络抖动 / 5xx / API 限流等临时错误
          gh_api_with_retry() {
            local max_attempts=3
            local attempt=1
            local delay=1
            local output rc
            while [ $attempt -le $max_attempts ]; do
              if output=$(gh api "$@" 2>/dev/null); then
                echo "$output"
                return 0
              fi
              rc=$?
              if [ $attempt -lt $max_attempts ]; then
                echo "  ⚠️ gh api 失败 (第 $attempt/$max_attempts 次),${delay}s 后重试" >&2
                sleep "$delay"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            echo "  ❌ gh api 最终失败 (3 次都失败)" >&2
            return 1
          }
          export -f gh_api_with_retry

          # dry-run 包装:DRY_RUN=true 时只 echo 不真写
          # 适用于所有 gh api 写操作 (POST/PATCH/DELETE)
          gh_api_write() {
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[DRY-RUN] gh api $*"
              return 0
            fi
            gh_api_with_retry "$@"
          }
          export -f gh_api_write

          # 单 fork 处理函数 (被 xargs -P 并发调用)
          # 每个调用重定向输出到独立 log 文件,最后按原顺序拼接
          process_fork() {
            local fork_json="$1"
            local FORK_REPO UPSTREAM_OWNER UPSTREAM_REPO UPSTREAM_DEFAULT
            local FORK_NAME
            FORK_NAME=$(echo "$fork_json" | jq -r '.name')
            local log_file="$LOG_DIR/${FORK_NAME}.log"
            exec > "$log_file" 2>&1

            FORK_REPO=$(echo "$fork_json" | jq -r '.name')
            UPSTREAM_OWNER=$(echo "$fork_json" | jq -r '.parent_owner')
            UPSTREAM_REPO=$(echo "$fork_json" | jq -r '.parent_name')
            UPSTREAM_DEFAULT=$(echo "$fork_json" | jq -r '.parent_default_branch')

            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "🔄 $FORK_REPO ← $UPSTREAM_OWNER/$UPSTREAM_REPO"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"

            # ----- 阶段 1: 上游存活检查 -----
            if [ -z "$UPSTREAM_DEFAULT" ]; then
              echo "::warning::上游不可访问 (删除/archived/私有化/网络故障),跳过"
              return 0
            fi
            echo "🔍 上游默认分支: $UPSTREAM_DEFAULT"

            # ----- 阶段 1.5: 危险检测 - 上游体积暴减 -----
            # 场景: 上游把源码删了只留 README/说明文件,同步会把 fork 源码也删光
            # 启发: GitHub repo .size 字段 (KB),当 fork 已有实质内容 (>= 50KB)
            #       且 upstream 体积/fork 体积 < SIZE_DROP_THRESHOLD 时,跳过整个 fork
            # SIZE_DROP_THRESHOLD 默认 0.10 (=10%,敏感);0.30 宽松;0 关闭
            # SIZE_CHECK_EXEMPT: 逗号分隔的 fork 名白名单,这些 fork 跳过 size 检查
            #                    适用于极小项目 (1KB CLI 工具) 被误杀的情况
            local FORK_SIZE UPSTREAM_SIZE THRESHOLD_PCT SKIP_SIZE_CHECK=false
            # 检查豁免名单 (精确匹配,逗号分隔)
            if [ -n "$SIZE_CHECK_EXEMPT" ] && \
               printf '%s' "$SIZE_CHECK_EXEMPT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -Fxq "$FORK_REPO"; then
              echo "⏭️  豁免 size 检查: $FORK_REPO 在 SIZE_CHECK_EXEMPT 白名单里"
              SKIP_SIZE_CHECK=true
            fi
            FORK_SIZE=$(gh_api_with_retry "repos/$MY_OWNER/$FORK_REPO" --jq '.size // 0' 2>/dev/null)
            UPSTREAM_SIZE=$(gh_api_with_retry "repos/$UPSTREAM_OWNER/$UPSTREAM_REPO" --jq '.size // 0' 2>/dev/null)
            THRESHOLD_PCT=$(awk "BEGIN {printf \"%.0f\", $SIZE_DROP_THRESHOLD * 100}")
            if [ "$SKIP_SIZE_CHECK" != "true" ] && [ "${FORK_SIZE:-0}" -ge 50 ] && [ "${UPSTREAM_SIZE:-0}" -gt 0 ] && \
               [ "$(awk "BEGIN {print ($UPSTREAM_SIZE < $FORK_SIZE * $SIZE_DROP_THRESHOLD) ? 1 : 0}")" = "1" ]; then
              local RATIO
              RATIO=$(awk "BEGIN {printf \"%.1f\", $UPSTREAM_SIZE * 100 / $FORK_SIZE}")
              echo "::error::🛑 危险: 上游体积暴减 (fork=${FORK_SIZE}KB → upstream=${UPSTREAM_SIZE}KB, 上游只剩 fork 的 ${RATIO}%,阈值 ${THRESHOLD_PCT}%)"
              echo "  疑似上游删除了源码,只留下 README/说明文件,跳过本次同步"
              echo "SKIPPED_SUMMARY|$FORK_REPO|上游体积暴减" >> "$log_file.summary"
              return 0
            fi
            if [ "$SKIP_SIZE_CHECK" = "true" ]; then
              echo "📏 体积检查跳过 (豁免): fork=${FORK_SIZE}KB, upstream=${UPSTREAM_SIZE}KB"
            else
              echo "📏 体积检查通过: fork=${FORK_SIZE}KB, upstream=${UPSTREAM_SIZE}KB (阈值 ${THRESHOLD_PCT}%)"
            fi

            # ----- 阶段 2: 备份当前 fork 默认分支 -----
            local FORK_DEFAULT_SHA
            FORK_DEFAULT_SHA=$(gh_api_with_retry "repos/$MY_OWNER/$FORK_REPO/git/ref/heads/$UPSTREAM_DEFAULT" \
                               --jq '.object.sha' 2>/dev/null || echo "")
            if [ -n "$FORK_DEFAULT_SHA" ]; then
              local BACKUP_TAG
              BACKUP_TAG="backup/$(date +%Y%m%d-%H%M%S)-${FORK_DEFAULT_SHA:0:7}"
              if gh_api_write -X POST "repos/$MY_OWNER/$FORK_REPO/git/refs" \
                   -f ref="refs/tags/$BACKUP_TAG" \
                   -f sha="$FORK_DEFAULT_SHA" >/dev/null 2>&1; then
                echo "💾 备份: $BACKUP_TAG → ${FORK_DEFAULT_SHA:0:7}"
              fi
            fi

            # ----- 阶段 3: 遍历 upstream 分支,逐个同步 -----
            local SYNCED=() FAILED=() NEW=() SKIPPED=() LOCAL_BACKED_UP=()

            local UPSTREAM_BRANCH_LIST
            UPSTREAM_BRANCH_LIST=$(gh_api_with_retry "repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/branches" \
                                   --jq -r '.[] | .name')

            for branch in $UPSTREAM_BRANCH_LIST; do
              echo "  ━━━ $branch ━━━"

              local UPSTREAM_SHA FORK_SHA
              UPSTREAM_SHA=$(gh_api_with_retry "repos/$UPSTREAM_OWNER/$UPSTREAM_REPO/git/ref/heads/$branch" \
                             --jq '.object.sha' 2>/dev/null || echo "")
              if [ -z "$UPSTREAM_SHA" ]; then
                echo "    ❌ 拿不到 upstream SHA"
                FAILED+=("$branch")
                continue
              fi

              FORK_SHA=$(gh_api_with_retry "repos/$MY_OWNER/$FORK_REPO/git/ref/heads/$branch" \
                         --jq '.object.sha' 2>/dev/null || echo "")

              if [ -z "$FORK_SHA" ]; then
                if gh_api_write -X POST "repos/$MY_OWNER/$FORK_REPO/git/refs" \
                     -f ref="refs/heads/$branch" \
                     -f sha="$UPSTREAM_SHA" >/dev/null 2>&1; then
                  echo "    🆕 新建 → ${UPSTREAM_SHA:0:7}"
                  NEW+=("$branch")
                  SYNCED+=("$branch")
                else
                  echo "    ❌ 新建失败"
                  FAILED+=("$branch")
                fi
                continue
              fi

              local COMPARE_JSON STATUS AHEAD BEHIND
              COMPARE_JSON=$(gh_api_with_retry "repos/$MY_OWNER/$FORK_REPO/compare/${UPSTREAM_OWNER}:${UPSTREAM_REPO}:${branch}...${branch}" \
                             --jq '{status: .status, ahead: .ahead_by, behind: .behind_by}' \
                             2>/dev/null || echo '{"status":"error"}')
              STATUS=$(echo "$COMPARE_JSON" | jq -r '.status // "error"')
              AHEAD=$(echo "$COMPARE_JSON" | jq -r '.ahead // 0')
              BEHIND=$(echo "$COMPARE_JSON" | jq -r '.behind // 0')

              # 3.4.0 本地修改自动备份
              # 当 fork 有 ahead commit (本地修改过) 且即将被 PATCH --force 覆盖时,
              # 先把 fork 当前 SHA 存到 local-backup/{branch}-{时间戳}-{sha7} 命名分支
              # 用户即使不知道改了也能找回,本地 clone 也还在
              if [ "$STATUS" = "ahead" ] || [ "$STATUS" = "diverged" ]; then
                if [ "$AHEAD" -gt 0 ] && [ -n "$FORK_SHA" ]; then
                  local BACKUP_BRANCH
                  BACKUP_BRANCH="local-backup/${branch}-$(date +%Y%m%d-%H%M%S)-${FORK_SHA:0:7}"
                  if gh_api_write -X POST "repos/$MY_OWNER/$FORK_REPO/git/refs" \
                       -f ref="refs/heads/$BACKUP_BRANCH" \
                       -f sha="$FORK_SHA" >/dev/null 2>&1; then
                    echo "    📦 本地修改备份: $BACKUP_BRANCH (含 $AHEAD 个 commit)"
                    LOCAL_BACKED_UP+=("$branch:$BACKUP_BRANCH")
                  else
                    echo "    ⚠️ 备份分支创建失败,继续 sync (本地修改可能丢失)"
                  fi
                fi
              fi

              case "$STATUS" in
                identical)
                  echo "    = 已同步 (${UPSTREAM_SHA:0:7})"
                  ;;
                behind)
                  if gh_api_write -X POST "repos/$MY_OWNER/$FORK_REPO/merge-upstream" \
                       -f branch="$branch" >/dev/null 2>&1; then
                    echo "    ⏪ 落后 $BEHIND → merge-upstream 快进"
                    SYNCED+=("$branch")
                  else
                    if gh_api_write -X PATCH "repos/$MY_OWNER/$FORK_REPO/git/refs/heads/$branch" \
                         -f sha="$UPSTREAM_SHA" -f force=true >/dev/null 2>&1; then
                      echo "    ⏪ 落后 $BEHIND → PATCH 兜底"
                      SYNCED+=("$branch")
                    else
                      echo "    ❌ merge + PATCH 都失败"
                      FAILED+=("$branch")
                    fi
                  fi
                  ;;
                ahead|diverged)
                  if gh_api_write -X PATCH "repos/$MY_OWNER/$FORK_REPO/git/refs/heads/$branch" \
                       -f sha="$UPSTREAM_SHA" -f force=true >/dev/null 2>&1; then
                    echo "    ⏩ 丢弃 $AHEAD + 拉入 $BEHIND → ${UPSTREAM_SHA:0:7}"
                    SYNCED+=("$branch")
                  else
                    echo "    ❌ PATCH 失败"
                    FAILED+=("$branch")
                  fi
                  ;;
                *)
                  echo "    ⚠️ compare 异常 (status=$STATUS)"
                  FAILED+=("$branch")
                  ;;
              esac
            done

            # ----- 阶段 4: 清理旧 backup tag -----
            local KEPT=20
            local TAGS
            TAGS=$(gh_api_with_retry "repos/$MY_OWNER/$FORK_REPO/git/refs/tags" \
                   --jq -r '.[] | .ref' 2>/dev/null \
                   | sed 's|refs/tags/||' \
                   | grep '^backup/' || true)
            local TAG_COUNT
            TAG_COUNT=$(echo "$TAGS" | grep -c . || echo 0)
            if [ "$TAG_COUNT" -gt "$KEPT" ]; then
              echo "  🗑️ 清理旧 backup tag ($TAG_COUNT → 保留 $KEPT)"
              echo "$TAGS" | tail -n +$((KEPT+1)) | while read -r tag; do
                [ -z "$tag" ] && continue
                gh_api_write -X DELETE "repos/$MY_OWNER/$FORK_REPO/git/refs/tags/$tag" \
                  >/dev/null 2>&1 && echo "    - $tag"
              done
            fi

            # ----- 阶段 5: 单 fork 汇总 -----
            echo ""
            echo "  📊 $FORK_REPO: 🆕${#NEW[@]} ✅${#SYNCED[@]} ❌${#FAILED[@]} ⏭️${#SKIPPED[@]} 📦${#LOCAL_BACKED_UP[@]}"

            # 写汇总到共享 jsonl 文件 (并发安全,每 fork 追加一行)
            # 用 $RUNNER_TEMP 而非 $LOG_DIR,因为 LOG_DIR 会在 EXIT trap 里被删
            # Step 3 会读这份文件聚合后发 issue
            jq -n -c \
              --arg name "$FORK_REPO" \
              --argjson new "${#NEW[@]}" \
              --argjson synced "${#SYNCED[@]}" \
              --argjson failed "${#FAILED[@]}" \
              --argjson skipped "${#SKIPPED[@]}" \
              --argjson local_backup "${#LOCAL_BACKED_UP[@]}" \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{name: $name, new: $new, synced: $synced, failed: $failed, skipped: $skipped, local_backup: $local_backup, ts: $ts}' \
              >> "$RUNNER_TEMP/summary.jsonl"
          }
          export -f process_fork
          export MY_OWNER SIZE_DROP_THRESHOLD SIZE_CHECK_EXEMPT LOG_DIR

          # API 限流检查:剩余配额 = 0 时睡到 reset
          # 一次只查一次 (在 xargs 启动前),各 fork 不再重复查
          check_rate_limit() {
            local info
            info=$(gh_api_with_retry "rate_limit" \
              --jq '{remaining: .resources.core.remaining, reset: .resources.core.reset, limit: .resources.core.limit}' 2>/dev/null || echo '{}')
            local remaining reset limit now wait
            remaining=$(echo "$info" | jq -r '.remaining // 9999')
            reset=$(echo "$info" | jq -r '.reset // 0')
            limit=$(echo "$info" | jq -r '.limit // 5000')
            echo "📊 rate limit: $remaining/$limit"
            if [ "$remaining" -le 0 ] 2>/dev/null; then
              now=$(date +%s)
              wait=$((reset - now + 10))
              if [ $wait -gt 0 ] && [ $wait -lt 3700 ]; then
                local reset_human
                reset_human=$(date -d "@$reset" '+%H:%M:%S' 2>/dev/null || date -r "$reset" '+%H:%M:%S')
                echo "  ⏸️  限流,等待 ${wait}s (到 $reset_human UTC)"
                sleep "$wait"
                echo "  ✅ 等待完毕,继续"
              fi
            fi
          }
          check_rate_limit

          # 并发跑 (MAX_PARALLEL 个同时),xargs 会等所有完成
          echo "$FORKS" | jq -c '.[]' | xargs -P "$MAX_PARALLEL" -I {} bash -c 'process_fork "$@"' _ {}

          # 按原始 fork 顺序输出所有 log
          echo "$FORKS" | jq -r '.name' | while read -r name; do
            if [ -f "$LOG_DIR/$name.log" ]; then
              cat "$LOG_DIR/$name.log"
            fi
          done

          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ 全部 fork 处理完毕 (并发 $MAX_PARALLEL)"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # =====================================================================
      # Step 3: 汇总到 issue (跑完自动开/更新一个固定 issue 贴汇总)
      # =====================================================================
      - name: Post issue summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e

          # 找 Step 2 写的 summary.jsonl
          SUMMARY_FILE="$RUNNER_TEMP/summary.jsonl"

          # 重试包装 (Step 2 已定义,Step 3 subshell 隔离,需重新定义)
          gh_api_with_retry() {
            local max_attempts=3
            local attempt=1
            local delay=1
            local output rc
            while [ $attempt -le $max_attempts ]; do
              if output=$(gh api "$@" 2>/dev/null); then
                echo "$output"
                return 0
              fi
              rc=$?
              if [ $attempt -lt $max_attempts ]; then
                echo "  ⚠️ gh api 失败 (第 $attempt/$max_attempts 次),${delay}s 后重试" >&2
                sleep "$delay"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            echo "  ❌ gh api 最终失败 (3 次都失败)" >&2
            return 1
          }

          # dry-run 包装
          gh_api_write() {
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[DRY-RUN] gh api $*"
              return 0
            fi
            gh_api_with_retry "$@"
          }

          if [ ! -f "$SUMMARY_FILE" ] || [ ! -s "$SUMMARY_FILE" ]; then
            echo "⚠️ 没找到 summary.jsonl ($SUMMARY_FILE),跳过 issue 通知"
            exit 0
          fi

          # 聚合统计
          SUMMARY_JSON=$(jq -s '.' "$SUMMARY_FILE")
          TOTAL=$(echo "$SUMMARY_JSON" | jq 'length')
          TOTAL_NEW=$(echo "$SUMMARY_JSON" | jq '[.[].new] | add // 0')
          TOTAL_SYNCED=$(echo "$SUMMARY_JSON" | jq '[.[].synced] | add // 0')
          TOTAL_FAILED=$(echo "$SUMMARY_JSON" | jq '[.[].failed] | add // 0')
          TOTAL_SKIPPED=$(echo "$SUMMARY_JSON" | jq '[.[].skipped] | add // 0')
          TOTAL_BACKUP=$(echo "$SUMMARY_JSON" | jq '[.[].local_backup] | add // 0')
          RUN_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 拼 issue body (markdown)
          # 关键:用 printf -v 直接赋值给变量,绕开 $(...) 命令替换吞尾部 \n
          # YAML literal block 不支持跨行字符串拼接,所以全在一个 printf -v 里完成
          ISSUE_TITLE="🤖 Fork Sync Report"
          DETAIL_ROWS=$(echo "$SUMMARY_JSON" | jq -r '.[] | "| \(.name) | \(.new) | \(.synced) | \(.failed) | \(.skipped) | \(.local_backup) |"')
          printf -v ISSUE_BODY "## 同步汇总\n\n- **运行时间**: %s (UTC)\n- **同步 fork 数**: %s\n- 🆕 新建分支: **%s**\n- ✅ 已同步: **%s**\n- ❌ 失败: **%s**\n- ⏭️ 跳过: **%s**\n- 📦 本地修改备份: **%s**\n\n### 详情\n\n| Fork | 🆕 | ✅ | ❌ | ⏭️ | 📦 |\n|---|---|---|---|---|---|\n%s" \
            "$RUN_TS" "$TOTAL" "$TOTAL_NEW" "$TOTAL_SYNCED" "$TOTAL_FAILED" "$TOTAL_SKIPPED" "$TOTAL_BACKUP" "$DETAIL_ROWS"

          # 找已有 issue
          EXISTING=$(gh_api_with_retry "repos/$MY_OWNER/${{ github.event.repository.name }}/issues?state=all&labels=&per_page=100" \
                     --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" 2>/dev/null | head -1 || echo "")

          if [ -n "$EXISTING" ]; then
            # 已有 → 更新
            gh_api_write -X PATCH "repos/$MY_OWNER/${{ github.event.repository.name }}/issues/$EXISTING" \
              -f title="$ISSUE_TITLE" \
              -f body="$ISSUE_BODY" >/dev/null
            echo "📝 更新 issue #$EXISTING"
          else
            # 没有 → 新建
            NEW_ISSUE=$(gh_api_write -X POST "repos/$MY_OWNER/${{ github.event.repository.name }}/issues" \
                        -f title="$ISSUE_TITLE" \
                        -f body="$ISSUE_BODY" 2>/dev/null)
            NEW_NUM=$(echo "$NEW_ISSUE" | jq -r '.number // empty')
            echo "📝 新建 issue #$NEW_NUM"
          fi
