

# =============================================================================
# GitHub Fork 自动同步工作流 - 动态发现版 (个人日常使用配置)
# =============================================================================
# 适用: 自动同步你名下指定 fork 到上游 (排除 claude 相关库)
# 风格: 动态发现 (auto-discover) + 名称模式排除
# 优势: GitHub CLI/API 调用,只 checkout 配置仓库脚本,不 checkout 目标 fork,自动备份,智能判断 ahead/behind
#
# 跟 examples/sync-dynamic.yml 的区别:
#   - examples/sync-dynamic.yml: 通用模板,默认同步所有 fork
#   - 本文件 (sync-dynamic.yml): 作者日常使用,自动排除 claude 相关 fork
#
# 排除规则 (在 EXCLUDE_PATTERN 配置):
#   - 名称含 "claude" (大小写不敏感) 的 fork 会被跳过
#   - 想排除别的: 改 EXCLUDE_PATTERN,比如 "anthropic" / "openai" / "test"
#   - 不想排除: 改成 ""
#
# 一次性配置 (4 步):
#   1. 仓库 Settings → Secrets and variables → Actions
#      新增 FORK_SYNC_TOKEN (PAT,需要目标 fork 的 Contents read/write 权限)
#   2. 仓库 Settings → Actions → General → Workflow permissions
#      改成 "Read and write permissions" (重要!否则 PATCH 全部 403)
#   3. Actions 标签页点 "I understand my workflows, go ahead and enable them"
#   4. (可选) 手动触发一次看效果
#
# 详细文档见 ../docs/ 目录
# =============================================================================

name: Sync My Forks (Exclude Claude)

on:
  # 改频率:把下面 3 行取消注释你想用的,注释掉不用的 (cron 是 UTC 时间)
  #   '0 0 * * *'    = 每天 00:00 UTC (北京时间 08:00) — 默认
  #   '0 */6 * * *'  = 每 6 小时 (00, 06, 12, 18 UTC)
  #   '0 0 * * 1'    = 每周一 00:00 UTC (北京时间周一 08:00)
  schedule:
    - cron: '0 0 * * *'
    # - cron: '0 */6 * * *'
    # - cron: '0 0 * * 1'
  # 允许 Actions 标签页手动触发
  workflow_dispatch:
    inputs:
      cron_schedule:
        description: '手动触发时填的 cron 表达式,只 log 不影响逻辑 (实际自动 schedule 看上面块)'
        required: false
        default: ''
      upstream_owner_filter:
        description: '只同步这个 owner 旗下的 fork (留空 = 所有)'
        required: false
        default: ''
      target_owners:
        description: '要同步的 fork owner 列表 (逗号分隔,留空 = 自己;支持用户名和 org,自动判断)'
        required: false
        default: ''
      only_repos:
        description: '只同步这些 fork 仓库名,逗号分隔;支持 repo 或 owner/repo (留空 = 不限制,适合单仓库测试)'
        required: false
        default: ''
      exclude_pattern:
        description: '排除仓库名含这个 pattern 的 fork (留空 = 用默认,匹配的是 fork 仓库名,不是 README 或代码)'
        required: false
        default: ''
      exclude_repos:
        description: '指定要排除的 fork 名,逗号分隔 (留空 = 不排除指定 fork)'
        required: false
        default: ''
      size_drop_threshold:
        description: '上游体积暴减告警阈值 (上游体积/fork 体积 < 此值触发,默认 0.10 = 10%)'
        required: false
        default: ''
      size_check_exempt:
        description: '豁免 size 检查的 fork 名,逗号分隔 (留空 = 不豁免任何 fork,适用于 1KB CLI 工具之类的小项目)'
        required: false
        default: ''
      max_parallel:
        description: '最大并发数 (默认 4,推荐 2-8,过高会触发 API 限流)'
        required: false
        default: ''
      max_branches_per_fork:
        description: '每个 fork 最多同步 upstream 分支数 (默认 6;0 = 不限制)'
        required: false
        default: ''
      skip_branch_patterns:
        description: '跳过 upstream 分支 glob,逗号分隔 (默认跳过 backup/local-backup/sync-upstream/dependabot)'
        required: false
        default: ''
      full_branch_sync_repos:
        description: '这些 fork 同步全部 upstream 分支,逗号分隔;支持 repo 或 owner/repo'
        required: false
        default: ''
      branch_limit_groups:
        description: '按分支数分组指定 fork,格式 3:repo-a,repo-b;10:owner/repo-c;0:repo-d'
        required: false
        default: ''
      branch_limit_overrides:
        description: '按仓库指定任意分支上限,格式 repo=12,owner/repo=20;0 = 不限制'
        required: false
        default: ''
      dry_run:
        description: '干跑模式 (true = 只看不动,只打 log 不真写,默认 false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      sync_mode:
        description: '同步模式 (auto = 自动同步;pr = 开 PR 让人审,只对 behind 状态有效)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - pr
      webhook_url:
        description: '完成后通知的 webhook URL (留空 = 不通知;支持 Slack / 钉钉 / 通用,看 webhook_type)'
        required: false
        default: ''
      webhook_type:
        description: 'webhook 类型 (slack / dingtalk / generic)'
        required: false
        default: 'slack'
        type: choice
        options:
          - slack
          - dingtalk
          - generic
      discard_local_changes:
        description: 'upstream 有新增且 fork 有本地提交时的处理方式'
        required: false
        default: 'force'
        type: choice
        options:
          - force
          - keep

# 显式声明需要写权限
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  sync-all:
    runs-on: ubuntu-latest
    env:
      MY_OWNER: ${{ github.repository_owner }}
      # 多仓库同步请配置 FORK_SYNC_TOKEN (PAT);否则通常只能写当前配置仓库。
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      # 日常使用配置: 排除 claude 相关 fork
      # 想排除别的关键词改这里 (大小写不敏感,匹配 fork 名称)
      # 留空 = 不排除任何 fork
      DEFAULT_EXCLUDE_PATTERN: 'claude'
      # 日常使用配置: 体积暴减告警阈值
      # 上游体积/fork 体积 < 此值时触发告警,跳过 fork
      # 0.10 = 上游只剩 fork 的 10% 触发 (推荐,敏感)
      # 0.30 = 上游只剩 fork 的 30% 触发 (宽松,大重构可能误判)
      # 0    = 关闭体积检查 (不推荐,会失去上游删源码防护)
      DEFAULT_SIZE_DROP_THRESHOLD: '0.10'
      # 日常使用配置: 最大并发 fork 数
      # 4 推荐值(够快又不触发限流),8 激进,1 串行
      DEFAULT_MAX_PARALLEL: '4'
      # 日常使用配置: 每个 fork 默认最多处理的 upstream 分支数
      # 6 = 先处理默认分支 + 前 5 个其他分支,避免多分支仓库打爆 API
      # 0 = 不限制 (只建议在单仓库测试或白名单里使用)
      DEFAULT_MAX_BRANCHES_PER_FORK: '6'
      # 日常使用配置: 默认跳过自动生成/备份类 upstream 分支
      # 默认分支永远优先处理,不受这里影响
      DEFAULT_SKIP_BRANCH_PATTERNS: 'backup/*,local-backup/*,sync-upstream/*,dependabot/*'
      # 日常使用配置: 特定 fork 分支上限口子 (逗号分隔,支持 repo 或 owner/repo)
      DEFAULT_FULL_BRANCH_SYNC_REPOS: ''
      # 任意分组口子: 3:repo-a,repo-b;10:owner/repo-c;0:repo-d
      DEFAULT_BRANCH_LIMIT_GROUPS: ''
      # 任意 N 口子: repo=12,owner/repo=20;值为 0 表示该 repo 不限制
      DEFAULT_BRANCH_LIMIT_OVERRIDES: ''
      # 日常使用配置: 豁免 size 检查的 fork 名 (逗号分隔)
      # 适用于极小项目 (1KB CLI 工具等),被 size 检查误杀时加这里
      # 留空 = 不豁免任何 fork
      DEFAULT_SIZE_CHECK_EXEMPT: ''
      # 日常使用配置: upstream 有新增且 fork 有本地提交时的处理方式
      # force = 去重备份本地修改后,执行 GitHub Discard commits,和 upstream 完全一致 (默认)
      # keep  = 去重备份本地修改后,使用 merge-upstream 合并上游更新
      # 纯 ahead 且 upstream 无新增时跳过,不备份也不写分支
      DEFAULT_DISCARD_LOCAL_CHANGES: 'force'
    steps:
      # =====================================================================
      # Step 0: 准备共享函数
      # 早期公共函数:给 checkout 之前的配置读取/发现步骤使用。
      # 同步主流程已迁移到 scripts/ 下,避免 workflow YAML 持续膨胀。
      # =====================================================================
      - name: Prepare shared helpers
        run: |
          set -e
          cat > "$RUNNER_TEMP/sync-lib.sh" <<'SYNC_LIB'
          #!/usr/bin/env bash

          wait_for_core_rate_limit() {
            local info remaining reset limit now wait reset_human
            info=$(gh api rate_limit \
              --jq '{remaining: .resources.core.remaining, reset: .resources.core.reset, limit: .resources.core.limit}' \
              2>/dev/null || echo '{}')
            remaining=$(echo "$info" | jq -r '.remaining // 9999')
            reset=$(echo "$info" | jq -r '.reset // 0')
            limit=$(echo "$info" | jq -r '.limit // 5000')
            if [ "$remaining" -le 0 ] 2>/dev/null; then
              now=$(date +%s)
              wait=$((reset - now + 10))
              if [ "$wait" -gt 0 ] && [ "$wait" -lt 3700 ]; then
                reset_human=$(date -d "@$reset" '+%H:%M:%S' 2>/dev/null || date -r "$reset" '+%H:%M:%S')
                echo "  ⏸️ GitHub API rate limit 已用尽 ($remaining/$limit),等待 ${wait}s 到 $reset_human UTC" >&2
                sleep "$wait"
                return 0
              fi
            fi
            return 1
          }
          export -f wait_for_core_rate_limit

          gh_api_with_retry() {
            local max_attempts=3
            local attempt=1
            local delay=1
            local output rc
            while [ "$attempt" -le "$max_attempts" ]; do
              output=$(gh api "$@" 2>&1)
              rc=$?
              if [ "$rc" -eq 0 ]; then
                echo "$output"
                return 0
              fi
              if printf '%s' "$output" | grep -Eiq 'rate limit|API rate limit exceeded'; then
                wait_for_core_rate_limit && continue
              fi
              if [ "$attempt" -lt "$max_attempts" ]; then
                echo "  ⚠️ gh api 失败 (第 $attempt/$max_attempts 次),${delay}s 后重试: $(printf '%s' "$output" | head -1)" >&2
                sleep "$delay"
                delay=$((delay * 2))
              fi
              attempt=$((attempt + 1))
            done
            if [ -n "${GH_API_ERROR_FILE:-}" ]; then
              printf '%s\n' "$output" > "$GH_API_ERROR_FILE" 2>/dev/null || true
            fi
            echo "  ❌ gh api 最终失败 (3 次都失败): $(printf '%s' "$output" | head -1)" >&2
            return 1
          }
          export -f gh_api_with_retry

          gh_api_capture() {
            local __out_var="$1" __err_var="$2"
            shift 2
            local output rc error_file stderr_file error_output
            error_file=$(mktemp)
            stderr_file=$(mktemp)
            output=$(GH_API_ERROR_FILE="$error_file" gh_api_with_retry "$@" 2>"$stderr_file")
            rc=$?
            printf -v "$__out_var" '%s' "$output"
            if [ "$rc" -ne 0 ]; then
              if [ -s "$error_file" ]; then
                error_output=$(cat "$error_file")
              else
                error_output=$(cat "$stderr_file")
              fi
              printf -v "$__err_var" '%s' "$error_output"
            else
              printf -v "$__err_var" '%s' ""
            fi
            rm -f "$error_file" "$stderr_file"
            return "$rc"
          }
          export -f gh_api_capture

          gh_api_write() {
            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[DRY-RUN] gh api $*"
              return 0
            fi
            gh_api_with_retry "$@"
          }
          export -f gh_api_write

          gh_api_write_capture() {
            local __out_var="$1" __err_var="$2"
            shift 2
            if [ "${DRY_RUN:-false}" = "true" ]; then
              printf -v "$__out_var" '[DRY-RUN] gh api %s' "$*"
              printf -v "$__err_var" '%s' ""
              return 0
            fi
            gh_api_capture "$__out_var" "$__err_var" "$@"
          }
          export -f gh_api_write_capture

          log_event() {
            local fork="$1" action="$2" result="$3"
            shift 3
            local extra_json="{}"
            if [ "$#" -gt 0 ]; then
              extra_json=$(printf '%s\n' "$@" | jq -R 'split("=") | {(.[0]): (.[1:] | join("="))}' | jq -s 'add')
            fi
            jq -n -c \
              --arg ts "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
              --arg fork "$fork" \
              --arg action "$action" \
              --arg result "$result" \
              --arg mode "${SYNC_MODE:-direct}" \
              --arg run_id "${GITHUB_RUN_ID:-local}" \
              --argjson extra "$extra_json" \
              '{ts: $ts, fork: $fork, action: $action, result: $result, mode: $mode, run_id: $run_id} + $extra' \
              >> "${RUNNER_TEMP:-/tmp}/events.jsonl" 2>/dev/null || true
          }
          export -f log_event
          SYNC_LIB

      # =====================================================================
      # Step 1: 发现 fork
      # =====================================================================
      # =====================================================================
      # Step 0: 读 .github/sync-config.yml (用户配置文件,优先级: input > config > default)
      # 把 config 覆盖写到 $GITHUB_ENV,后续 step 用 env.CONFIG_X 引用
      # 支持的 key: exclude_pattern / exclude_repos / size_drop_threshold /
      #            size_check_exempt / max_parallel / max_branches_per_fork /
      #            skip_branch_patterns / full_branch_sync_repos /
      #            branch_limit_groups / branch_limit_overrides /
      #            sync_mode / webhook_type / discard_local_changes
      # 格式: 简单的 key: value (不支持嵌套 YAML,值用引号包起来)
      # =====================================================================
      - name: Read sync config
        id: read-config
        env:
          CONFIG_REPO: ${{ github.event.repository.name }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          CONFIG_YAML=$(gh_api_with_retry "repos/$MY_OWNER/$CONFIG_REPO/contents/.github/sync-config.yml" \
                        --jq '.content // ""' 2>/dev/null | base64 -d 2>/dev/null || echo "")

          if [ -z "$CONFIG_YAML" ]; then
            echo "📄 未找到 .github/sync-config.yml,用默认配置"
            exit 0
          fi

          echo "📄 找到 .github/sync-config.yml,加载覆盖:"
          for KEY in exclude_pattern exclude_repos size_drop_threshold size_check_exempt \
                     max_parallel max_branches_per_fork skip_branch_patterns full_branch_sync_repos \
                     branch_limit_groups branch_limit_overrides sync_mode webhook_type \
                     discard_local_changes; do
            VAL=$(echo "$CONFIG_YAML" | grep -E "^${KEY}:" | head -1 \
                  | sed -E "s/^${KEY}:[[:space:]]*//" \
                  | sed 's/^["'"'"']//;s/["'"'"']$//' || echo "")
            if [ -n "$VAL" ]; then
              echo "  ✓ $KEY = $VAL"
              echo "CONFIG_${KEY^^}=${VAL}" >> "$GITHUB_ENV"
            fi
          done

      - name: Discover forks
        id: discover
        env:
          FILTER: ${{ inputs.upstream_owner_filter }}
          # 三段 fallback: input > config file > env default
          EXCLUDE_PATTERN: ${{ inputs.exclude_pattern || env.CONFIG_EXCLUDE_PATTERN || env.DEFAULT_EXCLUDE_PATTERN }}
          # 手动指定要排除的 fork 名 (逗号分隔,精确匹配);config 可覆盖
          EXCLUDE_REPOS: ${{ inputs.exclude_repos || env.CONFIG_EXCLUDE_REPOS }}
          # 手动输入优先,否则用默认体积暴减阈值
          SIZE_DROP_THRESHOLD: ${{ inputs.size_drop_threshold || env.CONFIG_SIZE_DROP_THRESHOLD || env.DEFAULT_SIZE_DROP_THRESHOLD }}
          # 手动输入优先,否则用默认 size 豁免名单
          SIZE_CHECK_EXEMPT: ${{ inputs.size_check_exempt || env.CONFIG_SIZE_CHECK_EXEMPT || env.DEFAULT_SIZE_CHECK_EXEMPT }}
          # 手动触发的 cron (只 log,不影响自动 schedule)
          CRON_SCHEDULE: ${{ inputs.cron_schedule }}
          # 当前仓库名 (用于读 .github/sync-config.yml)
          CONFIG_REPO: ${{ github.event.repository.name }}
          # 多 owner 支持 (Item 17):逗号分隔,留空 = 自己
          TARGET_OWNERS: ${{ inputs.target_owners }}
          # 单仓库/少量仓库测试:逗号分隔,支持 repo 或 owner/repo
          ONLY_REPOS: ${{ inputs.only_repos }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          json_lines_to_array() {
            if [ -n "$1" ]; then
              printf '%s\n' "$1" | jq -s '.'
            else
              echo "[]"
            fi
          }

          list_authenticated_owner_fork_candidates() {
            local lines
            if lines=$(gh_api_with_retry --paginate 'user/repos?per_page=100&type=owner&sort=updated' \
              --jq ".[] | select(.fork == true and .owner.login == \"$MY_OWNER\") | {name: .name, fork_owner: .owner.login}" 2>/dev/null); then
              json_lines_to_array "$lines"
            else
              echo "[]"
            fi
          }

          list_named_owner_fork_candidates() {
            local owner="$1"
            local lines

            if lines=$(gh_api_with_retry --paginate "users/$owner/repos?per_page=100&type=owner&sort=updated" \
              --jq '.[] | select(.fork == true) | {name: .name, fork_owner: .owner.login}' 2>/dev/null); then
              echo "  ✓ $owner (user/public endpoint)" >&2
              json_lines_to_array "$lines"
              return 0
            fi

            if lines=$(gh_api_with_retry --paginate "orgs/$owner/repos?per_page=100&sort=updated" \
              --jq '.[] | select(.fork == true) | {name: .name, fork_owner: .owner.login}' 2>/dev/null); then
              echo "  ✓ $owner (org endpoint)" >&2
              json_lines_to_array "$lines"
              return 0
            fi

            echo "  ⚠️ $owner: 既不是 user 也不是 org (或无权访问),跳过" >&2
            echo "[]"
            return 1
          }

          enrich_fork_candidates() {
            local candidates="$1"
            local candidate_count
            candidate_count=$(echo "$candidates" | jq length)
            if [ "$candidate_count" -eq 0 ]; then
              echo "[]"
              return 0
            fi

            echo "  ↳ 补齐 $candidate_count 个 fork 的 upstream 信息" >&2
            while IFS= read -r fork_json; do
              local fork_owner fork_name detail
              fork_owner=$(echo "$fork_json" | jq -r '.fork_owner')
              fork_name=$(echo "$fork_json" | jq -r '.name')

              if detail=$(gh_api_with_retry "repos/$fork_owner/$fork_name" 2>/dev/null); then
                if echo "$detail" | jq -e '.fork == true' >/dev/null 2>&1; then
                  echo "$detail" | jq -c '{
                    name: .name,
                    fork_owner: .owner.login,
                    fork_default_branch: (.default_branch // "main"),
                    parent_name: (.parent.name // ""),
                    parent_owner: (.parent.owner.login // ""),
                    parent_default_branch: (.parent.default_branch // ""),
                    upstream_unavailable_reason: (if .parent == null then "parent 信息不可用: 上游仓库可能已删除、私有化、改名或 fork 关系失效" else "" end)
                  }'
                else
                  echo "  ⚠️ $fork_owner/$fork_name: 不是 fork 或 fork 信息不可用,跳过" >&2
                fi
              else
                echo "  ⚠️ $fork_owner/$fork_name: 仓库详情不可访问,跳过" >&2
              fi
            done < <(echo "$candidates" | jq -c '.[]') | jq -s '.'
          }

          only_repo_candidates() {
            echo "$ONLY_REPOS" | jq -R '
              split(",")
              | map(gsub("^ +| +$"; ""))
              | map(select(length > 0))
              | map(
                  if contains("/") then
                    split("/") | {fork_owner: .[0], name: .[1]}
                  else
                    {fork_owner: env.MY_OWNER, name: .}
                  end
                )
            '
          }

          # 收集 fork 列表:列表 API 只保证有 fork=true,不保证带 parent/source。
          # 所以先分页拿候选,再逐个 GET /repos/{owner}/{repo} 补齐 upstream。
          FORKS="[]"
          if [ -n "$ONLY_REPOS" ]; then
            echo "🎯 only_repos 快速模式: 只查询指定 fork,不扫描全量账号 → $ONLY_REPOS"
            CANDIDATES=$(only_repo_candidates)
            FORKS=$(enrich_fork_candidates "$CANDIDATES")
          elif [ -z "$TARGET_OWNERS" ]; then
            echo "🌐 默认 owner: $MY_OWNER"
            AUTH_CANDIDATES=$(list_authenticated_owner_fork_candidates)
            PUBLIC_CANDIDATES=$(list_named_owner_fork_candidates "$MY_OWNER" || true)
            CANDIDATES=$(jq -s 'add | unique_by(.fork_owner + "/" + .name)' \
              <(echo "$AUTH_CANDIDATES") <(echo "$PUBLIC_CANDIDATES"))
            FORKS=$(enrich_fork_candidates "$CANDIDATES")
          else
            OWNER_LIST=$(echo "$TARGET_OWNERS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$')
            OWNER_COUNT=$(echo "$OWNER_LIST" | wc -l | tr -d ' ')
            echo "🌐 多 owner 模式: $OWNER_COUNT 个 owner → $(echo $OWNER_LIST | tr '\n' ',' | sed 's/,$//')"
            for owner in $OWNER_LIST; do
              CANDIDATES=$(list_named_owner_fork_candidates "$owner" || true)
              FORK_BATCH=$(enrich_fork_candidates "$CANDIDATES")
              FORKS=$(jq -s 'add | unique_by(.fork_owner + "/" + .name)' <(echo "$FORKS") <(echo "$FORK_BATCH"))
            done
          fi

          # 正向过滤: 只保留指定 owner 的 fork
          if [ -n "$FILTER" ]; then
            FORKS=$(echo "$FORKS" | jq --arg f "$FILTER" '[.[] | select(.parent_owner == $f)]')
            echo "🔍 正向过滤: 只保留 parent_owner == $FILTER"
          fi

          # 反向过滤: 排除仓库名 (fork repo name) 含 EXCLUDE_PATTERN 的 fork (大小写不敏感)
          # 注意: 只匹配仓库名,不看 README/代码/描述
          if [ -n "$EXCLUDE_PATTERN" ]; then
            FORKS=$(echo "$FORKS" | jq --arg e "$EXCLUDE_PATTERN" \
              '[.[] | select((.name | ascii_downcase | contains($e | ascii_downcase)) | not)]')
            echo "🚫 反向过滤: 排除仓库名含 '$EXCLUDE_PATTERN' (大小写不敏感,只匹配 fork 仓库名)"
          fi

          # 反向过滤: 排除指定名称的 fork (精确匹配,逗号分隔)
          if [ -n "$EXCLUDE_REPOS" ]; then
            # 把 "a, b ,c" 转成 ["a","b","c"] 这样的 JSON 数组
            EXCLUDE_JSON=$(echo "$EXCLUDE_REPOS" | jq -R 'split(",") | map(gsub("^ +| +$"; "")) | map(select(length > 0))')
            EXCLUDE_COUNT=$(echo "$EXCLUDE_JSON" | jq length)
            FORKS=$(echo "$FORKS" | jq --argjson excl "$EXCLUDE_JSON" \
              '[.[] | select(.name as $n | $excl | index($n) == null)]')
            echo "🚫 指定排除: $EXCLUDE_COUNT 个 fork → $EXCLUDE_REPOS"
          fi

          COUNT=$(echo "$FORKS" | jq length)
          if [ -n "$ONLY_REPOS" ] && [ "$COUNT" -eq 0 ]; then
            echo "::error::only_repos 没匹配到任何 fork: $ONLY_REPOS"
            echo "  提示:填 fork 仓库名,例如 lanhu-mcp_dsphper; 多 owner 时也可填 Link-Start/lanhu-mcp_dsphper"
            exit 1
          fi
          echo "forks<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FORKS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ 没找到任何符合条件的 fork"
            exit 0
          fi

          echo "🔍 发现 $COUNT 个 fork 待同步"
          echo "$FORKS" | jq -r '.[] | "  - \(.name) ← \(.parent_owner)/\(.parent_name)"'

          # 手动触发时 echo 用户填的 cron_schedule (自动 schedule 走 schedule 块)
          if [ -n "$CRON_SCHEDULE" ]; then
            echo "🕐 手动触发,模拟 cron: $CRON_SCHEDULE"
          fi

      - name: Checkout config repository
        uses: actions/checkout@v4

      # =====================================================================
      # Step 2: 并发同步 fork (脚本化实现,避免 workflow YAML 继续膨胀)
      # =====================================================================
      - name: Sync each fork
        env:
          FORKS: ${{ steps.discover.outputs.forks }}
          MAX_PARALLEL: ${{ inputs.max_parallel || env.CONFIG_MAX_PARALLEL || env.DEFAULT_MAX_PARALLEL }}
          SIZE_DROP_THRESHOLD: ${{ inputs.size_drop_threshold || env.CONFIG_SIZE_DROP_THRESHOLD || env.DEFAULT_SIZE_DROP_THRESHOLD }}
          SIZE_CHECK_EXEMPT: ${{ inputs.size_check_exempt || env.CONFIG_SIZE_CHECK_EXEMPT || env.DEFAULT_SIZE_CHECK_EXEMPT }}
          MAX_BRANCHES_PER_FORK: ${{ inputs.max_branches_per_fork || env.CONFIG_MAX_BRANCHES_PER_FORK || env.DEFAULT_MAX_BRANCHES_PER_FORK }}
          SKIP_BRANCH_PATTERNS: ${{ inputs.skip_branch_patterns || env.CONFIG_SKIP_BRANCH_PATTERNS || env.DEFAULT_SKIP_BRANCH_PATTERNS }}
          FULL_BRANCH_SYNC_REPOS: ${{ inputs.full_branch_sync_repos || env.CONFIG_FULL_BRANCH_SYNC_REPOS || env.DEFAULT_FULL_BRANCH_SYNC_REPOS }}
          BRANCH_LIMIT_GROUPS: ${{ inputs.branch_limit_groups || env.CONFIG_BRANCH_LIMIT_GROUPS || env.DEFAULT_BRANCH_LIMIT_GROUPS }}
          BRANCH_LIMIT_OVERRIDES: ${{ inputs.branch_limit_overrides || env.CONFIG_BRANCH_LIMIT_OVERRIDES || env.DEFAULT_BRANCH_LIMIT_OVERRIDES }}
          DRY_RUN: ${{ inputs.dry_run }}
          SYNC_MODE: ${{ inputs.sync_mode || env.CONFIG_SYNC_MODE || 'auto' }}
          CONFIG_REPO: ${{ github.event.repository.name }}
          DISCARD_LOCAL_CHANGES: ${{ inputs.discard_local_changes || env.CONFIG_DISCARD_LOCAL_CHANGES || env.DEFAULT_DISCARD_LOCAL_CHANGES }}
        run: scripts/sync-each-fork.sh

      # =====================================================================
      # Step 2.5: Drift 检测 (Item 15)
      # 读 workflow-state 分支上的 .drift-state.json(可能不存在)→ 合并本次结果 →
      # 连续 3 次 fail 的 fork 开 issue 告警 → 写回新 state
      # 跟 sync-config.yml 不同:.drift-state.json 是 workflow 自己管理的状态文件,
      # 但不再写回 main,避免污染配置仓库主分支
      # =====================================================================
      - name: Detect drift
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          DRIFT_FILE=".drift-state.json"
          STATE_BRANCH="workflow-state"
          DRIFT_THRESHOLD=3

          SYNC_STATE="$RUNNER_TEMP/sync-state.json"
          if [ ! -f "$SYNC_STATE" ] || [ ! -s "$SYNC_STATE" ]; then
            echo "⏭️  无 sync-state.json,跳过 drift 检测"
            exit 0
          fi

          # 读 workflow-state 分支上的旧 drift state (可能分支或文件都不存在)
          OLD_DRIFT_JSON=$(gh_api_with_retry "repos/$MY_OWNER/$REPO/contents/$DRIFT_FILE?ref=$STATE_BRANCH" 2>/dev/null || echo "")
          if [ -n "$OLD_DRIFT_JSON" ] && [ "$OLD_DRIFT_JSON" != "Not Found" ]; then
            OLD_B64=$(echo "$OLD_DRIFT_JSON" | jq -r '.content // ""')
            OLD_SHA=$(echo "$OLD_DRIFT_JSON" | jq -r '.sha // ""')
            if [ -n "$OLD_B64" ]; then
              OLD_STATE=$(echo "$OLD_B64" | base64 -d 2>/dev/null || echo "{}")
            else
              OLD_STATE="{}"
            fi
          else
            OLD_STATE="{}"
            OLD_SHA=""
            echo "📄 .drift-state.json 不存在,从空开始"
          fi

          # 合并:对每个 fork,fail→consecutive_failures+1,否则重置为 0
          NEW_STATE=$(jq -s --argjson old "$OLD_STATE" '
            {
              forks: (
                ($old.forks // {}) as $old_forks
                | .[0] as $current
                | $current | keys | map(
                    . as $fork
                    | $current[$fork].last_result as $result
                    | ($old_forks[$fork].consecutive_failures // 0) as $old_cf
                    | {
                        ($fork): {
                          last_result: $result,
                          last_ts: $current[$fork].last_ts,
                          consecutive_failures: (
                            if $result == "fail" then $old_cf + 1
                            else 0
                            end
                          ),
                          last_alert_ts: (if $old_forks[$fork].last_alert_ts == null then null else $old_forks[$fork].last_alert_ts end)
                        }
                      }
                  ) | add // {}
              ),
              updated_at: (now | todate)
            }
          ' "$SYNC_STATE")

          echo "📊 drift state 更新后:"
          echo "$NEW_STATE" | jq '.forks'

          # 找连续失败达到阈值的 fork
          ALERT_FORKS=$(echo "$NEW_STATE" | jq -r --argjson th "$DRIFT_THRESHOLD" \
            '.forks | to_entries | map(select(.value.consecutive_failures >= $th)) | .[].key')
          if [ -n "$ALERT_FORKS" ]; then
            ALERT_COUNT=$(printf '%s\n' "$ALERT_FORKS" | grep -c .)
          else
            ALERT_COUNT=0
          fi

          if [ "$ALERT_COUNT" -gt 0 ]; then
            echo "🚨 检测到 $ALERT_COUNT 个 fork 连续失败 ≥ $DRIFT_THRESHOLD 次: $ALERT_FORKS"
            # 开 issue 告警
            DETAIL=$(echo "$NEW_STATE" | jq -r --argjson th "$DRIFT_THRESHOLD" \
              '.forks | to_entries[] | select(.value.consecutive_failures >= $th) | "- **\(.key)**: 连续失败 \(.value.consecutive_failures) 次 (最后: \(.value.last_ts))"')
            ISSUE_TITLE="🚨 Fork Drift Alert: 连续失败"
            printf -v ISSUE_BODY "以下 fork 连续失败 ≥ %s 次,可能 fork 或 upstream 出问题,请排查:\n\n%s\n\n- 排查方式:查看 Actions log 和 [Artifact](https://github.com/%s/%s/actions/runs/%s)\n- 解决后下次 run 成功会自动清除告警状态" \
              "$DRIFT_THRESHOLD" "$DETAIL" "$MY_OWNER" "$REPO" "$GITHUB_RUN_ID"

            if [ "${DRY_RUN:-false}" = "true" ]; then
              echo "[DRY-RUN] 会开 issue: $ISSUE_TITLE"
            else
              NEW_ISSUE=$(gh_api_with_retry -X POST "repos/$MY_OWNER/$REPO/issues" \
                -f title="$ISSUE_TITLE" \
                -f body="$ISSUE_BODY" \
                -f label="drift-alert" 2>/dev/null)
              NEW_NUM=$(echo "$NEW_ISSUE" | jq -r '.number // empty' 2>/dev/null)
              if [ -n "$NEW_NUM" ]; then
                echo "📝 开漂移告警 issue #$NEW_NUM"
                # 标记这些 fork 的 last_alert_ts
                NEW_STATE=$(echo "$NEW_STATE" | jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                  '.forks |= with_entries(
                    if .value.consecutive_failures >= '"$DRIFT_THRESHOLD"' then .value.last_alert_ts = $ts else . end
                  )')
              fi
            fi
          else
            echo "✅ 无 drift 告警"
          fi

          # 写回 .drift-state.json (用 API PUT)
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "[DRY-RUN] 写回 $STATE_BRANCH/$DRIFT_FILE 跳过"
          else
            STATE_BRANCH_SHA=$(gh_api_with_retry "repos/$MY_OWNER/$REPO/git/ref/heads/$STATE_BRANCH" \
              --jq '.object.sha // ""' 2>/dev/null || echo "")
            if [ -z "$STATE_BRANCH_SHA" ]; then
              DEFAULT_BRANCH=$(gh_api_with_retry "repos/$MY_OWNER/$REPO" --jq '.default_branch // "main"' 2>/dev/null || echo "main")
              DEFAULT_SHA=$(gh_api_with_retry "repos/$MY_OWNER/$REPO/git/ref/heads/$DEFAULT_BRANCH" \
                --jq '.object.sha // ""' 2>/dev/null || echo "")
              if [ -n "$DEFAULT_SHA" ]; then
                gh_api_write -X POST "repos/$MY_OWNER/$REPO/git/refs" \
                  -f ref="refs/heads/$STATE_BRANCH" \
                  -f sha="$DEFAULT_SHA" >/dev/null 2>&1 && \
                  echo "🌿 已创建状态分支: $STATE_BRANCH ← $DEFAULT_BRANCH" || \
                  echo "::warning::状态分支 $STATE_BRANCH 创建失败,后续写回可能失败"
              fi
            fi

            B64_CONTENT=$(echo "$NEW_STATE" | base64 -w 0)
            PUT_ARGS=(-X PUT "repos/$MY_OWNER/$REPO/contents/$DRIFT_FILE" \
              -f message="chore: update drift state (run $GITHUB_RUN_ID)" \
              -f content="$B64_CONTENT" \
              -f branch="$STATE_BRANCH")
            if [ -n "$OLD_SHA" ]; then
              PUT_ARGS+=(-f sha="$OLD_SHA")
            fi
            gh_api_with_retry "${PUT_ARGS[@]}" >/dev/null 2>&1 && \
              echo "📝 $STATE_BRANCH/$DRIFT_FILE 已更新" || \
              echo "::warning::$STATE_BRANCH/$DRIFT_FILE 写回失败(权限或冲突)"
          fi

      # =====================================================================
      # Step 3: 汇总到 issue (跑完自动开/更新一个固定 issue 贴汇总)
      # =====================================================================
      - name: Post issue summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -e
          # 共享函数:gh_api_with_retry / gh_api_write / log_event
          # (每个 step 是独立 bash 调用,函数不跨 step 共享,必须 source)
          source "$RUNNER_TEMP/sync-lib.sh"

          # 找 Step 2 写的 summary.jsonl
          SUMMARY_FILE="$RUNNER_TEMP/summary.jsonl"

          if [ ! -f "$SUMMARY_FILE" ] || [ ! -s "$SUMMARY_FILE" ]; then
            echo "⚠️ 没找到 summary.jsonl ($SUMMARY_FILE),跳过 issue 通知"
            exit 0
          fi

          # 聚合统计
          SUMMARY_JSON=$(jq -s '.' "$SUMMARY_FILE")
          TOTAL=$(echo "$SUMMARY_JSON" | jq 'length')
          TOTAL_NEW=$(echo "$SUMMARY_JSON" | jq '[.[].new] | add // 0')
          TOTAL_SYNCED=$(echo "$SUMMARY_JSON" | jq '[.[].synced] | add // 0')
          TOTAL_FAILED=$(echo "$SUMMARY_JSON" | jq '[.[].failed] | add // 0')
          TOTAL_SKIPPED=$(echo "$SUMMARY_JSON" | jq '[.[].skipped] | add // 0')
          TOTAL_BACKUP=$(echo "$SUMMARY_JSON" | jq '[.[].local_backup] | add // 0')
          RUN_TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # 拼 issue body (markdown)
          # 关键:用 printf -v 直接赋值给变量,绕开 $(...) 命令替换吞尾部 \n
          # YAML literal block 不支持跨行字符串拼接,所以全在一个 printf -v 里完成
          ISSUE_TITLE="🤖 Fork Sync Report"
          DETAIL_ROWS=$(echo "$SUMMARY_JSON" | jq -r '.[] | "| \(.name) | \(.result // "ok") | \(.reason // "") | \(.new) | \(.synced) | \(.failed) | \(.skipped) | \(.local_backup) |"')
          FAILURE_ROWS=$(echo "$SUMMARY_JSON" | jq -r '
            def clean:
              tostring
              | gsub("[\r\n|]"; " ")
              | if length > 240 then .[0:237] + "..." else . end;
            [ .[] as $fork
              | ($fork.failure_details // [])[]?
              | "| \($fork.name | clean) | \(.branch | clean) | \(.reason | clean) | \(.hint | clean) | HTTP \((.api_status // "") | clean): \((.api_message // "") | clean) | \(.api_path | clean) |"
            ] | if length == 0 then "| - | - | - | - | - | - |" else .[] end
          ')
          printf -v ISSUE_BODY "## 同步汇总\n\n- **运行时间**: %s (UTC)\n- **同步 fork 数**: %s\n- 🆕 新建分支: **%s**\n- ✅ 已同步: **%s**\n- ❌ 失败: **%s**\n- ⏭️ 跳过: **%s**\n- 📦 本地修改备份: **%s**\n\n### 详情\n\n| Fork | Result | Reason | 🆕 | ✅ | ❌ | ⏭️ | 📦 |\n|---|---|---|---|---|---|---|---|\n%s\n\n### 失败详情\n\n| Fork | Branch | Reason | Meaning | GitHub | API |\n|---|---|---|---|---|---|\n%s" \
            "$RUN_TS" "$TOTAL" "$TOTAL_NEW" "$TOTAL_SYNCED" "$TOTAL_FAILED" "$TOTAL_SKIPPED" "$TOTAL_BACKUP" "$DETAIL_ROWS" "$FAILURE_ROWS"

          # 找已有 issue
          EXISTING=$(gh_api_with_retry "repos/$MY_OWNER/${{ github.event.repository.name }}/issues?state=all&labels=&per_page=100" \
                     --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" 2>/dev/null | head -1 || echo "")

          if [ -n "$EXISTING" ]; then
            # 已有 → 更新
            gh_api_write -X PATCH "repos/$MY_OWNER/${{ github.event.repository.name }}/issues/$EXISTING" \
              -f title="$ISSUE_TITLE" \
              -f body="$ISSUE_BODY" >/dev/null
            echo "📝 更新 issue #$EXISTING"
          else
            # 没有 → 新建
            NEW_ISSUE=$(gh_api_write -X POST "repos/$MY_OWNER/${{ github.event.repository.name }}/issues" \
                        -f title="$ISSUE_TITLE" \
                        -f body="$ISSUE_BODY" 2>/dev/null)
            NEW_NUM=$(echo "$NEW_ISSUE" | jq -r '.number // empty')
            echo "📝 新建 issue #$NEW_NUM"
          fi

      # =====================================================================
      # Step 4: 发送 webhook 通知 (Slack / 钉钉 / 通用)
      # 优先用 secrets.WEBHOOK_URL (推荐),其次 inputs.webhook_url
      # webhook 失败不影响 workflow 整体结果
      # =====================================================================
      - name: Send webhook notification
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL || inputs.webhook_url }}
          WEBHOOK_TYPE: ${{ inputs.webhook_type || env.CONFIG_WEBHOOK_TYPE || 'slack' }}
        run: |
          set -e

          if [ -z "$WEBHOOK_URL" ]; then
            echo "⏭️  webhook_url 未配置,跳过通知"
            exit 0
          fi

          # 复用 Step 3 的 summary 数据
          SUMMARY_FILE="$RUNNER_TEMP/summary.jsonl"
          if [ ! -f "$SUMMARY_FILE" ] || [ ! -s "$SUMMARY_FILE" ]; then
            echo "⚠️ 没找到 summary.jsonl,跳过通知"
            exit 0
          fi

          SUMMARY_JSON=$(jq -s '.' "$SUMMARY_FILE")
          TOTAL=$(echo "$SUMMARY_JSON" | jq 'length')
          TOTAL_NEW=$(echo "$SUMMARY_JSON" | jq '[.[].new] | add // 0')
          TOTAL_SYNCED=$(echo "$SUMMARY_JSON" | jq '[.[].synced] | add // 0')
          TOTAL_FAILED=$(echo "$SUMMARY_JSON" | jq '[.[].failed] | add // 0')
          TOTAL_SKIPPED=$(echo "$SUMMARY_JSON" | jq '[.[].skipped] | add // 0')
          TOTAL_BACKUP=$(echo "$SUMMARY_JSON" | jq '[.[].local_backup] | add // 0')
          REPO_NAME="${{ github.event.repository.name }}"

          # 用 jq 构造 payload (自动 escape 换行/特殊字符)
          PAYLOAD=$(jq -n \
            --arg total "$TOTAL" --arg new "$TOTAL_NEW" --arg synced "$TOTAL_SYNCED" \
            --arg failed "$TOTAL_FAILED" --arg skipped "$TOTAL_SKIPPED" --arg backup "$TOTAL_BACKUP" \
            --arg repo "$REPO_NAME" --arg url "https://github.com/${{ github.repository_owner }}/$REPO_NAME/issues" \
            --arg type "$WEBHOOK_TYPE" '
            "🤖 *Fork Sync 完成* [\($repo)]\n同步: \($total) 个 fork\n🆕 新建: \($new) | ✅ 同步: \($synced) | ❌ 失败: \($failed)\n⏭️ 跳过: \($skipped) | 📦 本地备份: \($backup)\n查看 issue: \($url)" as $msg
            | if $type == "slack" then {text: $msg}
              elif $type == "dingtalk" then {msgtype: "markdown", markdown: {title: "Fork Sync", text: $msg}}
              else {message: $msg} end
          ')

          # POST 到 webhook (失败不中断 workflow)
          if curl -sf -X POST -H "Content-Type: application/json" \
                  -d "$PAYLOAD" "$WEBHOOK_URL" >/dev/null 2>&1; then
            echo "✅ webhook 通知已发送 ($WEBHOOK_TYPE)"
          else
            echo "::warning::webhook 发送失败 ($WEBHOOK_TYPE),但不影响 workflow"
          fi

      # =====================================================================
      # Step 5: 上传 artifact (Item 12: CSV + JSON 报告留档)
      # if: always() 让失败也留档,方便事后排查
      # 同一个 run 上传两个文件:events.jsonl (原始) + events.csv (易读)
      # 留 30 天 (默认 90,这里 30 够用 + 节省 artifact 存储)
      # =====================================================================
      - name: Upload sync artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-events
          path: |
            ${{ runner.temp }}/events.jsonl
            ${{ runner.temp }}/events.csv
            ${{ runner.temp }}/sync-state.json
          retention-days: 30
          if-no-files-found: warn
